<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171614"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta property="og:site_name" content="WATCH ARCHIVE">
<title>Collection — WATCH ARCHIVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f3ee;--paper:#fffdf8;--ink:#171717;--muted:#77736b;--line:#d9d5cc;--soft:#ece9e2}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.page{width:100%;max-width:1100px;margin:auto}.hero{position:relative;min-height:min(88svh,980px);height:min(88svh,980px);background:#29241f;overflow:hidden;color:#fff}
.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,transparent 32%,rgba(0,0,0,.08) 52%,rgba(0,0,0,.72) 100%)}
.hero-top,.hero-copy{position:absolute;z-index:1;left:clamp(24px,6vw,72px);right:clamp(24px,6vw,72px)}
.hero-top{top:clamp(24px,5vw,54px);display:flex;align-items:center;justify-content:space-between}
.wordmark{font:600 15px Georgia,serif;letter-spacing:.16em}.edition{font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.78)}
.hero-copy{bottom:clamp(34px,7vw,78px)}
.kicker{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.78);margin-bottom:16px}
h1{font:clamp(42px,8vw,88px)/.98 Georgia,serif;letter-spacing:-.045em;margin:0 0 18px;max-width:850px;text-wrap:balance}
.hero-meta{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.82)}
.content{width:min(100% - 44px,900px);margin:0 auto;padding:64px 0 80px}
.intro{max-width:670px;margin:0 auto 56px;text-align:center}
.section-kicker{font-size:9px;letter-spacing:.22em;color:var(--muted);font-weight:700}
.description{margin:15px auto 0;color:#625e56;font:clamp(16px,2.2vw,19px)/1.85 Georgia,serif;white-space:pre-wrap}
.collection-heading{display:flex;justify-content:space-between;align-items:end;gap:16px;padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:22px}
.collection-heading h2{margin:0;font:34px Georgia,serif}.collection-count{font-size:10px;letter-spacing:.15em;color:var(--muted)}
.watch-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:38px 22px}.watch{min-width:0}
.watch-image{display:block;width:100%;aspect-ratio:4/4.5;object-fit:cover;background:var(--soft)}
.watch-brand{margin-top:15px;font-size:9px;letter-spacing:.18em;color:var(--muted);font-weight:700;text-transform:uppercase}
.watch-model{margin-top:7px;font:clamp(21px,3vw,29px)/1.15 Georgia,serif;overflow-wrap:anywhere}
.watch-meta{margin-top:8px;color:var(--muted);font-size:11px;letter-spacing:.03em}
.watch-role{margin-top:10px;color:#625e56;font:italic 13px/1.7 Georgia,serif;white-space:pre-wrap}
.footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:9px;letter-spacing:.16em}
.state{min-height:70svh;display:grid;place-content:center;text-align:center;color:var(--muted);line-height:1.8;padding:30px}
.state strong{display:block;color:var(--ink);font:30px Georgia,serif;margin-bottom:10px}
@media(min-width:760px){.watch-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:46px 26px}.hero{min-height:780px}}
@media(max-width:560px){.hero{height:82svh;min-height:590px}.content{width:calc(100% - 36px);padding:48px 0 60px}.intro{margin-bottom:42px}.watch-list{gap:28px 12px}.watch-model{font-size:19px}.watch-brand{font-size:8px}.watch-meta{font-size:10px}.collection-heading h2{font-size:28px}.footer{font-size:8px}}
@media(prefers-color-scheme:dark){html,body{background:#171614;color:#f1eee7}.description,.watch-role{color:#b9b3a8}.collection-heading,.footer{border-color:#3b3833}.section-kicker,.collection-count,.watch-brand,.watch-meta,.footer{color:#aaa59b}.watch-image{background:#302d29}}
</style></head><body>
<main class="page" id="app"><div class="state"><strong>WATCH ARCHIVE</strong>컬렉션을 불러오고 있어요.</div></main>
<script>
const SUPABASE_URL="https://brtwmzobcukyifzjnkpb.supabase.co";
const SUPABASE_KEY="sb_publishable_9VmErfXpK1W4RK1BhGI5vA_3-EY0oKd";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
(async()=>{
 const token=new URLSearchParams(location.search).get('token');
 if(!token){document.getElementById('app').innerHTML='<div class="state"><strong>Collection not found</strong>유효하지 않은 공유 링크예요.</div>';return}
 const {data:share,error}=await client.rpc('get_collection_share',{p_token:token});
 if(error||!share){document.getElementById('app').innerHTML='<div class="state"><strong>Collection unavailable</strong>공유가 중단되었거나 존재하지 않는 링크예요.</div>';return}
 const items=Array.isArray(share.watch_items)?share.watch_items:[];
 document.title=(share.title||'Collection')+' — WATCH ARCHIVE';
 const hero=share.cover_image_url?'<img class="hero-image" src="'+esc(share.cover_image_url)+'" alt="">':'<div class="hero-image"></div>';
 document.getElementById('app').innerHTML=
 '<section class="hero">'+hero+
 '<div class="hero-top"><div class="wordmark">WATCH ARCHIVE</div><div class="edition">A PERSONAL ARCHIVE</div></div>'+
 '<div class="hero-copy"><div class="kicker">A COLLECTION OF TIME</div><h1>'+esc(share.title||'My Collection')+'</h1><div class="hero-meta">'+(share.collector_name?'CURATED BY '+esc(share.collector_name).toUpperCase()+'　·　':'')+String(items.length).padStart(2,'0')+' TIMEPIECES</div></div></section>'+
 '<section class="content">'+
 (share.description?'<div class="intro"><div class="section-kicker">COLLECTOR’S NOTE</div><p class="description">'+esc(share.description)+'</p></div>':'')+
 '<div class="collection-heading"><h2>The Collection</h2><span class="collection-count">'+String(items.length).padStart(2,'0')+' PIECES</span></div>'+
 '<section class="watch-list">'+items.map(w=>'<article class="watch">'+(w.image_url?'<img class="watch-image" src="'+esc(w.image_url)+'" alt="'+esc((w.brand||'')+' '+(w.model||''))+'" loading="lazy">':'<div class="watch-image"></div>')+
 '<div class="watch-brand">'+esc(w.brand||'')+'</div><div class="watch-model">'+esc(w.model||'Untitled')+'</div><div class="watch-meta">'+esc([w.movement].filter(Boolean).join(' · '))+'</div>'+(w.role_note?'<div class="watch-role">'+esc(w.role_note)+'</div>':'')+'</article>').join('')+'</section>'+
 '<footer class="footer"><span>WATCH ARCHIVE</span><span>A PERSONAL ARCHIVE OF TIMEPIECES</span></footer></section>';
})().catch(error=>{console.error(error);document.getElementById('app').innerHTML='<div class="state"><strong>Something went wrong</strong>컬렉션을 불러오지 못했어요.</div>'});
</script></body></html>
