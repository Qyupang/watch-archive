<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title"><title id="title">WATCH ARCHIVE</title><style>
@keyframes trackingReveal{from{letter-spacing:9px;opacity:0}to{letter-spacing:1.5px;opacity:1}}
@keyframes lineReveal{from{opacity:0;stroke-dashoffset:125}to{opacity:1;stroke-dashoffset:0}}
text{animation:trackingReveal 1.15s cubic-bezier(.2,.7,.2,1) both}
text:nth-of-type(2){animation-delay:.12s}
.rule{stroke-dasharray:125;animation:lineReveal .7s ease-out .65s both}
@media(prefers-reduced-motion:reduce){text,.rule{animation:none;opacity:1;letter-spacing:1.5px}}
</style><rect width="720" height="250" fill="none"/><g fill="#f7f4ec" font-family="Georgia, 'Times New Roman', serif" font-weight="300" text-anchor="middle"><text x="360" y="100" font-size="76" letter-spacing="1.5">WATCH</text><text x="360" y="174" font-size="76" letter-spacing="1.2">ARCHIVE</text></g><g fill="none" stroke="#f7f4ec" stroke-width="1.5"><path class="rule" d="M185 207H310"/><path class="rule" d="M410 207H535"/></g><rect x="348" y="204" width="24" height="4" fill="#f7f4ec"/></svg>