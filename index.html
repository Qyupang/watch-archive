.photoactions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.action{width:100%;padding:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none}.action:active{background:#ece9e2}.primary{background:#111;color:#fff;border-color:#111}.primary:active{background:#2a2a2a}
.heroWrap{position:relative;width:100%;height:min(52vh,520px);max-height:520px;overflow:hidden;background:#e5e1d8;display:flex;align-items:center;justify-content:center}.heroWrap img.hero{width:100%;height:100%;object-fit:contain;display:block}.watchPager{position:absolute;right:12px;bottom:12px;background:#111c;color:#fff;padding:6px 9px;border-radius:999px;font-size:10px;z-index:2}.heroGallery{position:relative;width:100%;background:#e5e1d8;overflow:hidden}.heroTrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}.heroTrack::-webkit-scrollbar{display:none}.heroSlide{flex:0 0 100%;width:100%;height:min(65vh,620px);scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#e5e1d8}.heroSlide img{width:100%;height:100%;object-fit:cover;display:block}.heroCount{position:absolute;right:12px;bottom:12px;background:#111b;color:#fff;padding:5px 9px;border-radius:999px;font-size:10px;z-index:2}.heroDots{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);display:flex;gap:5px;z-index:2}.heroDot{width:5px;height:5px;border-radius:50%;background:#fff9;border:0;padding:0}.heroDot.active{background:#fff}.detailpad{padding:20px}.detailbrand{font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:700}.detailmodel{font:42px Georgia,serif;margin:7px 0 16px}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);padding:6px 9px;font-size:11px}.note{font-size:17px;line-height:1.65;white-space:pre-wrap}.detailphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.detailphotos button{border:0;padding:0;background:none;position:relative;aspect-ratio:1;overflow:hidden}.detailphotos img{width:100%;height:100%;object-fit:cover;display:block}.actions{display:flex;align-items:stretch;justify-content:center;gap:0;margin-top:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.actions button{flex:1;padding:13px 6px;border:0;background:transparent;color:var(--ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase;position:relative}.actions button+button:before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:1px;background:var(--line)}.actions button:active{background:#ece9e2}.actions .delete{color:var(--muted)}.watchNav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.watchNav button{border:0;background:transparent;color:var(--muted);padding:9px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.watchNav button:active{color:var(--ink)}.lightbox{position:fixed;inset:0;background:#000f;z-index:50;display:flex;align-items:center;justify-content:center}.lightboxTrack{width:100%;height:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.lightboxTrack::-webkit-scrollbar{display:none}.lightboxSlide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:22px}.lightboxSlide img{max-width:100%;max-height:88%;object-fit:contain}.lightboxClose{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#111;font-size:25px;z-index:2}.lightboxCount{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:6px 10px;border-radius:999px;font-size:10px;z-index:2}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:999px;font-size:11px;z-index:60}.authbox{max-width:430px;margin:14vh auto 0;padding:28px 20px;background:var(--paper);border:1px solid var(--line)}.authbox h1{font:36px Georgia,serif;margin:0 0 8px}.authbox p{font-size:12px;color:var(--muted);line-height:1.6}.authbox input{width:100%;border:1px solid var(--line);background:#fff;padding:13px;margin:6px 0}.authactions{display:grid;gap:8px;margin-top:12px}.authmsg{font-size:11px;color:var(--muted);margin-top:10px;min-height:16px}.hidden{display:none!important}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.overlay{align-items:center}.sheet{max-width:650px;border-radius:24px;max-height:90vh}}
</style></head>

<script>
const SUPABASE_URL="https://brtwmzobcukyifzjnkpb.supabase.co", SUPABASE_KEY="sb_publishable_9VmErfXpK1W4RK1BhGI5vA_3-EY0oKd";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DB='watch-archive-v2',STORE='watches',BRANDS_KEY='watch-archive-brands-v1';
const DEFAULT_BRANDS=['Rolex','Omega','TAG Heuer','Tudor','Cartier','Jaeger-LeCoultre','Patek Philippe','Audemars Piguet','Vacheron Constantin','Breguet','Breitling','IWC','Zenith','Hublot','Longines','Grand Seiko','Seiko','Citizen','Casio','Timex','Bulgari','Piaget','Panerai','Hamilton','Oris','Nomos','Sinn','Tissot','Rado','Heuer'];
let watches=[],filter='owned',query='',detail=null,editing=null,editPhotos=[],editStatus='owned',brands=[],currentUser=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function authScreen(message=''){ $('#app').innerHTML='<main class="app"><section class="authbox"><div class="eyebrow">PERSONAL WATCH ARCHIVE</div><h1>Watch Archive</h1><p>내 시계와 사진을 여러 기기에서 안전하게 보관하려면 로그인해주세요.</p><input id="authEmail" type="email" autocomplete="email" placeholder="Email"><input id="authPassword" type="password" autocomplete="current-password" placeholder="Password"><div class="authactions"><button class="action primary" onclick="signIn()">Sign in</button><button class="action" onclick="signUp()">Create account</button></div><div class="authmsg" id="authmsg">'+esc(message)+'</div></section></main>'}
async function signIn(){let email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return toast('이메일과 비밀번호를 입력해주세요');let{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)$('#authmsg').textContent=error.message}
async function signUp(){let email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return toast('이메일과 비밀번호를 입력해주세요');if(password.length<6)return toast('비밀번호는 6자 이상이어야 합니다');let{data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:'https://qyupang.github.io/watch-archive/'}});if(error)$('#authmsg').textContent=error.message;else $('#authmsg').textContent=data.session?'가입 및 로그인 완료':'가입 완료. 이메일 인증이 필요한 경우 메일을 확인해주세요.'}
async function signOut(){await supabaseClient.auth.signOut();currentUser=null;watches=[];authScreen()}
async function loadBrands(){let saved=[];try{saved=JSON.parse(localStorage.getItem(BRANDS_KEY)||'[]')}catch(e){}let{data}=await supabaseClient.from('brands').select('name').eq('user_id',currentUser.id).order('name');brands=[...new Set([...DEFAULT_BRANDS,...saved,...(data||[]).map(x=>x.name)].filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function saveBrands(){localStorage.setItem(BRANDS_KEY,JSON.stringify(brands))}
async function addBrand(){let name=prompt('추가할 브랜드명을 입력하세요.');if(!name)return '';name=name.trim();if(!name)return '';let existing=brands.find(b=>b.toLowerCase()===name.toLowerCase());if(existing)return existing;let{error}=await supabaseClient.from('brands').insert({user_id:currentUser.id,name});if(error){toast('브랜드 저장에 실패했어요');return ''}brands.push(name);brands.sort((a,b)=>a.localeCompare(b));saveBrands();return name}
function brandOptions(selected=''){let current=selected||'';return '<option value="" '+(!current?'selected':'')+'>브랜드 선택</option>'+brands.map(b=>'<option value="'+esc(b)+'" '+(b===current?'selected':'')+'>'+esc(b)+'</option>').join('')+'<option value="__add__">＋ 새 브랜드 추가</option>'}
function brandSelect(value=''){let current=value||'';return '<div style="display:grid;grid-template-columns:1fr auto;gap:7px"><select id="brand" style="width:100%;border:1px solid var(--line);background:#fff;padding:12px" onchange="if(this.value===\'__add__\'){addBrand().then(n=>{if(n){this.innerHTML=brandOptions(n);this.value=n}else{this.innerHTML=brandOptions();this.value=\'\'}})}">'+brandOptions(current)+'</select><button type="button" class="action" style="padding:12px 14px" onclick="addBrand().then(n=>{if(n){let s=document.querySelector(\'#brand\');s.innerHTML=brandOptions(n);s.value=n}})">＋</button></div>'}
function sizeNumber(value=''){return String(value||'').replace(/mm/gi,'').trim()}
function formatSizeInput(value=''){let n=String(value||'').replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');return n?n+'mm':''}
function movementOptions(selected=''){let options=[['Manual','Manual'],['Automatic','Automatic'],['Quartz','Quartz']];if(selected&&!options.some(x=>x[0].toLowerCase()===selected.toLowerCase()))options.unshift([selected,selected]);return options.map(([v,l])=>'<option value="'+esc(v)+'" '+(v.toLowerCase()===String(selected||'').toLowerCase()?'selected':'')+'>'+esc(l)+'</option>').join('')}
function toast(x){let t=$('#toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1600)}
function imgFile(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function addFiles(input){let a=await Promise.all([...input.files].map(imgFile));editPhotos.push(...a.map(src=>({id:uid(),src,cover:false,newPhoto:true})));renderEditor()}
function cover(w){return w.photos?.find(p=>p.cover)?.src||w.photos?.[0]?.src||''}
async function load(){let{data,error}=await supabaseClient.from('watches').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});if(error){toast('시계 데이터를 불러오지 못했어요');return}let rows=data||[];let{data:photos}=await supabaseClient.from('watch_photos').select('*').eq('user_id',currentUser.id).order('sort_order');watches=await Promise.all(rows.map(async w=>{let ps=(photos||[]).filter(p=>p.watch_id===w.id);ps=await Promise.all(ps.map(async p=>{let{data:s}=await supabaseClient.storage.from('watch-photos').createSignedUrl(p.storage_path,3600);return{id:p.id,src:s?.signedUrl||'',path:p.storage_path,cover:p.is_cover,sortOrder:p.sort_order}}));return{id:w.id,status:w.status,brand:w.brand,model:w.model,reference:w.reference||'',size:w.size||'',movement:w.movement||'',tags:w.tags||[],note:w.note||'',photos:ps,favorite:w.favorite,createdAt:w.created_at,updatedAt:w.updated_at}}));renderHome()}
function nav(){return`<nav class="navbar"><div class="navin"><button class="nav active" onclick="renderHome()"><span>⌚</span>Watches</button><button class="nav" onclick="photosPage()"><span>▧</span>Photos</button><button class="nav" onclick="settings()"><span>⋯</span>Settings</button></div></nav>`}
function dailyInspiration(){let pool=watches.flatMap(w=>(w.status==='archive'?(w.photos||[]).filter(p=>p?.src).map((p,i)=>({w,p,i})):[]));if(!pool.length)return "";let today=new Date();let key=`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;let hash=0;for(let i=0;i<key.length;i++)hash=(hash*31+key.charCodeAt(i))>>>0;let item=pool[hash%pool.length],ps=orderedPhotos(item.w),idx=ps.findIndex(p=>p.id===item.p.id);if(idx<0)idx=0;let day=today.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});return`<section class="inspiration"><div class="inspirationhead"><span class="inspirationeyebrow">DAILY INSPIRATION</span><span class="inspirationdate">${day}</span></div><img class="inspirationimg" src="${item.p.src}" alt="${esc(item.w.brand||'')} ${esc(item.w.model||'Watch')}" onclick="openLightbox(${JSON.stringify(item.w.id)},${idx})"><div class="inspirationmeta" onclick="openDetail(${JSON.stringify(item.w.id)})"><div class="inspirationbrand">${esc(item.w.brand||'BRAND')}</div><div class="inspirationmodel">${esc(item.w.model||'Untitled')}</div><div class="inspirationhint">Archive · 사진을 눌러 크게 보기</div></div></section>`}
function renderHome(){if(detail){renderDetail();return}let list=watches.filter(w=>w.status===filter&&(!query||JSON.stringify(w).toLowerCase().includes(query.toLowerCase()))),o=watches.filter(w=>w.status==='owned').length,a=watches.filter(w=>w.status==='archive').length;$('#app').innerHTML=`<main class="app"><div class="top"><div><div class="eyebrow">PERSONAL WATCH ARCHIVE</div><div class="brand">Watch Archive</div></div><button class="icon" onclick="settings()">⚙</button></div>${dailyInspiration()}<div class="tabs"><button class="tab ${filter==='owned'?'active':''}" onclick="filter='owned';query='';renderHome()">My Watches ${o}</button><button class="tab ${filter==='archive'?'active':''}" onclick="filter='archive';query='';renderHome()">Archive ${a}</button></div><input class="search" placeholder="브랜드, 모델, 레퍼런스, 태그 검색" value="${esc(query)}" oninput="query=this.value;renderHome()"><div class="stats"><div class="stat"><b>${o}</b><span>MY WATCHES</span></div><div class="stat"><b>${a}</b><span>ARCHIVE</span></div></div><div class="head"><h2>${filter==='owned'?'My Watches':'Archive'}</h2><span class="small">${list.length} entries</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">아직 등록된 시계가 없어.<br><br>＋ 버튼으로 추가해보자.</div>`}</main><button class="fab" onclick="openEditor()">＋</button>${nav()}`}
function card(w){return`<article class="card" onclick="openDetail('${w.id}')">${cover(w)?`<img class="cover" src="${cover(w)}">`:`<div class="cover"></div>`}<div class="cardbody"><div class="cardbrand">${esc(w.brand||'BRAND')}</div><div class="model">${esc(w.model||'Untitled')}</div><div class="meta">${esc(w.reference||'—')} · ${esc(w.size||'—')}</div>${w.favorite?'<span class="badge">♥ FAVORITE</span>':''}</div></article>`}
function openDetail(id){detail=id;renderDetail()}function closeDetail(){detail=null;renderHome()}
function orderedPhotos(w){let ps=[...(w.photos||[])];if(!ps.length)return[];let i=ps.findIndex(p=>p.cover);if(i>0){let c=ps.splice(i,1)[0];ps.unshift(c)}return ps}
function openLightbox(id,index=0){let w=watches.find(x=>x.id===id);if(!w||!w.photos?.length)return;let ps=orderedPhotos(w);$('#app').insertAdjacentHTML('beforeend',`<div class="lightbox" id="lightbox"><button class="lightboxClose" onclick="closeLightbox()">×</button><div class="lightboxTrack" id="lightboxTrack">${ps.map(p=>`<div class="lightboxSlide"><img src="${p.src}"></div>`).join('')}</div><div class="lightboxCount" id="lightboxCount">${index+1} / ${ps.length}</div></div>`);let t=$('#lightboxTrack');t.scrollLeft=t.clientWidth*index;t.addEventListener('scroll',updateLightboxCount,{passive:true})}
function updateLightboxCount(){let t=$('#lightboxTrack');let n=Math.round(t.scrollLeft/t.clientWidth);$('#lightboxCount').textContent=`${n+1} / ${t.children.length}`}
function closeLightbox(){$('#lightbox')?.remove()}
function renderHero(w){let ps=orderedPhotos(w);if(!ps.length)return '';return`<div class="heroGallery"><div class="heroTrack" id="heroTrack" onscroll="updateHeroDots()">${ps.map(p=>`<div class="heroSlide"><img src="${p.src}" onclick="openLightbox('${w.id}',${ps.indexOf(p)})"></div>`).join('')}</div><div class="heroCount">${ps.length} photo${ps.length>1?'s':''}</div>${ps.length>1?`<div class="heroDots">${ps.map((_,i)=>`<button class="heroDot ${i===0?'active':''}" onclick="heroTo(${i})"></button>`).join('')}</div>`:''}</div>`}
function heroTo(i){let t=$('#heroTrack');if(t)t.scrollTo({left:t.clientWidth*i,behavior:'smooth'})}
function updateHeroDots(){let t=$('#heroTrack');if(!t)return;let i=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('.heroDot').forEach((d,n)=>d.classList.toggle('active',n===i))}
function renderDetail(){
 let idx=watches.findIndex(x=>x.id===detail);
 if(idx<0)return closeDetail();
 let w=watches[idx], prev=watches[(idx-1+watches.length)%watches.length], next=watches[(idx+1)%watches.length];
 $('#app').innerHTML=`<main class="detail" id="detailSwipe">${cover(w)?`<div class="heroWrap"><img class="hero" src="${cover(w)}"><div class="watchPager">${idx+1} / ${watches.length}</div></div>`:''}<div class="detailpad"><button class="icon" onclick="closeDetail()">←</button><div class="detailbrand">${esc(w.brand||'BRAND')}</div><div class="detailmodel">${esc(w.model||'Untitled')}</div><div class="pills">${[['Ref.',w.reference],['Size',w.size],['Year',w.year],['Movement',w.movement]].filter(x=>x[1]).map(x=>`<span class="pill">${esc(x[0])} ${esc(x[1])}</span>`).join('')}</div>${w.note?`<div class="head"><h2>My Note</h2></div><div class="note">${esc(w.note)}</div>`:''}${w.tags?.length?`<div class="pills" style="margin:16px 0">${w.tags.map(t=>`<span class="pill">#${esc(t)}</span>`).join('')}</div>`:''}<div class="head"><h2>Photos</h2><span class="small">${w.photos.length}</span></div><div class="detailphotos">${w.photos.map(p=>`<img src="${p.src}">`).join('')}</div><div class="actions"><button onclick="openEditor(watches.find(x=>x.id==='${w.id}'))">Edit</button><button onclick="favorite('${w.id}')">${w.favorite?'♥ Favorite':'♡ Favorite'}</button><button onclick="delWatch('${w.id}')" class="delete">Delete</button></div><div class="watchNav"><button onclick="openDetail('${prev.id}')">← Previous</button><button onclick="openDetail('${next.id}')">Next →</button></div></div></main>`;
 const area=document.getElementById('detailSwipe');
 if(area){let sx=0,sy=0,st=0;area.addEventListener('touchstart',e=>{let t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});area.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;if(dt<700&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.25)openDetail(dx<0?next.id:prev.id)},{passive:true})}
}
async function favorite(id){let w=watches.find(x=>x.id===id);if(!w)return;let{error}=await supabaseClient.from('watches').update({favorite:!w.favorite}).eq('id',id).eq('user_id',currentUser.id);if(error)return toast('저장에 실패했어요');await load()}
async function delWatch(id){if(!confirm('이 시계를 삭제할까요?'))return;let w=watches.find(x=>x.id===id);if(w?.photos?.length)await supabaseClient.storage.from('watch-photos').remove(w.photos.map(p=>p.path).filter(Boolean));let{error}=await supabaseClient.from('watches').delete().eq('id',id).eq('user_id',currentUser.id);if(error){toast('삭제에 실패했어요');return}detail=null;await load();toast('삭제했어요')}
function openEditor(w=null){editing=w?.id||null;editPhotos=w?JSON.parse(JSON.stringify(w.photos||[])):[];editStatus=w?.status||filter;renderEditor()}
function setStatus(s){editStatus=s;renderEditor()}
function renderEditor(){let w=editing?watches.find(x=>x.id===editing):null;$('#app').innerHTML=`<div class="overlay"><section class="sheet"><div class="sheettop"><h1 class="title">${w?'Edit Watch':'New Watch'}</h1><button class="close" onclick="renderHome()">×</button></div><div class="field"><label>Photos</label><div class="photoactions"><button class="action" onclick="$('#gallery').click()">＋ 사진 보관함에서 추가</button></div><input id="gallery" class="hidden" type="file" accept="image/*" multiple onchange="addFiles(this)"><div class="photos">${editPhotos.map((p,i)=>`<div class="photo"><img src="${p.src}"><button onclick="editPhotos.splice(${i},1);renderEditor()">×</button>${p.cover?'<span class="covermark">COVER</span>':''}</div>`).join('')}</div></div><div class="field"><label>Collection</label><div class="status"><button class="${editStatus==='owned'?'active':''}" onclick="setStatus('owned')">My Watch</button><button class="${editStatus==='archive'?'active':''}" onclick="setStatus('archive')">Archive</button></div></div><div class="formgrid"><div class="field"><label>Brand</label>${brandSelect(w?.brand||'')}</div><div class="field"><label>Model</label><input id="model" value="${esc(w?.model)}" placeholder="Oyster Perpetual Date"></div><div class="field"><label>Reference</label><input id="reference" value="${esc(w?.reference)}" placeholder="1500"></div><div class="field"><label>Size</label><input id="size" inputmode="decimal" autocomplete="off" value="${esc(sizeNumber(w?.size||''))}" placeholder="34" oninput="this.value=this.value.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1')" onblur="this.value=formatSizeInput(this.value)"></div><div class="field"><label>Movement</label><select id="movement" style="width:100%;border:1px solid var(--line);background:#fff;padding:12px">${movementOptions(w?.movement||'')}</select></div><div class="field full"><label>Tags</label><input id="tags" value="${esc(w?.tags?.join(', '))}" placeholder="vintage, silver dial, 34mm"></div><div class="field full"><label>My Note</label><textarea id="note">${esc(w?.note)}</textarea></div></div><button class="action primary" style="margin-top:16px" onclick="save()">Save Watch</button></section></div>`}
function normalizeSizeValue(v){
 v=String(v||'').trim().replace(/mm/gi,'').trim();
 return v ? v+'mm' : '';
}
function normalizeSizeField(){
 const el=document.getElementById('size');
 if(el) el.value=normalizeSizeValue(el.value);
}
async function save(){let old=editing?watches.find(x=>x.id===editing):null;if(!$('#brand').value.trim()||!$('#model').value.trim())return toast('브랜드와 모델을 입력해주세요');if(editPhotos.length&&!editPhotos.some(p=>p.cover))editPhotos[0].cover=true;let watchId=old?.id||uid();let payload={id:watchId,user_id:currentUser.id,status:editStatus,brand:$('#brand').value.trim(),model:$('#model').value.trim(),reference:$('#reference').value.trim(),size:formatSizeInput($('#size').value),movement:$('#movement').value,tags:$('#tags').value.split(',').map(s=>s.trim()).filter(Boolean),note:$('#note').value.trim(),favorite:old?.favorite||false};let{error}=old?await supabaseClient.from('watches').update(payload).eq('id',watchId).eq('user_id',currentUser.id):await supabaseClient.from('watches').insert(payload);if(error){toast('시계 저장에 실패했어요');return}let oldPaths=new Set((old?.photos||[]).map(p=>p.path).filter(Boolean)),keptPaths=new Set();for(let i=0;i<editPhotos.length;i++){let p=editPhotos[i],path=p.path;if(!path){let ext=(p.src.match(/^data:image\/([^;]+)/)||[])[1]||'jpeg';ext=ext==='jpeg'?'jpg':ext;path=currentUser.id+'/'+watchId+'/'+p.id+'.'+ext;let blob=await(await fetch(p.src)).blob();let up=await supabaseClient.storage.from('watch-photos').upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:false});if(up.error){toast('사진 업로드에 실패했어요');return}}keptPaths.add(path);let{error:pe}=await supabaseClient.from('watch_photos').upsert({id:p.id,user_id:currentUser.id,watch_id:watchId,storage_path:path,is_cover:!!p.cover,sort_order:i});if(pe){toast('사진 정보 저장에 실패했어요');return}}let removed=[...oldPaths].filter(x=>!keptPaths.has(x));if(removed.length){await supabaseClient.storage.from('watch-photos').remove(removed);await supabaseClient.from('watch_photos').delete().eq('watch_id',watchId).eq('user_id',currentUser.id).in('storage_path',removed)}editing=null;await load();toast(old?'수정했어요':'저장했어요')}
function photosPage(){let a=watches.flatMap(w=>w.photos.map(p=>({w,p})));$('#app').innerHTML=`<main class="app"><div class="top"><div><div class="eyebrow">ALL PHOTOS</div><div class="brand">Photos</div></div></div>${a.length?`<div class="grid">${a.map(x=>`<article class="card" onclick="openDetail('${x.w.id}')"><img class="cover" src="${x.p.src}"><div class="cardbody"><div class="cardbrand">${esc(x.w.brand)}</div><div class="meta">${esc(x.w.model)}</div></div></article>`).join('')}</div>`:'<div class="empty">아직 사진이 없어.</div>'}</main>${nav()}`}
function settings(){const email=esc(currentUser?.email||'');$('#app').innerHTML='<main class="app"><div class="top"><div><div class="eyebrow">ARCHIVE TOOLS</div><div class="brand">Settings</div></div></div><div class="head"><h2>Account</h2></div><div class="empty">Supabase Cloud Archive<br><span class="small">'+email+'</span><br><br><button class="action" onclick="signOut()">Sign out</button></div></main>'+nav()}
async function boot(){let{data}=await supabaseClient.auth.getSession();currentUser=data.session?.user||null;if(!currentUser){authScreen();return}await loadBrands();await load()}supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;if(currentUser){loadBrands().then(load)}else authScreen()});boot();
</script></body></html>
