adding:13px 6px;border:0;background:transparent;color:var(--ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase;position:relative}.actions button+button:before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:1px;background:var(--line)}.actions button:active{background:#ece9e2}.actions .delete{color:var(--muted)}.watchNav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.watchNav button{border:0;background:transparent;color:var(--muted);padding:9px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.watchNav button:active{color:var(--ink)}.lightbox{position:fixed;inset:0;background:#000f;z-index:50;display:flex;align-items:center;justify-content:center;touch-action:none}.lightboxTrack{width:100%;height:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}.lightboxTrack::-webkit-scrollbar{display:none}.lightboxSlide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:22px}.lightboxSlide img{max-width:100%;max-height:88%;width:auto;height:auto;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;transform:translate3d(0,0,0) scale(1);transform-origin:center center;will-change:transform;touch-action:none}

/* Editor UI refinement */
.sheet{
  padding:24px 20px 42px;
  background:var(--paper);
}
.sheet .sheettop{
  margin-bottom:18px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.sheet .title{
  font-size:30px;
  letter-spacing:-.02em;
}
.sheet .close{
  width:38px;height:38px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
}
.sheet .field{margin-top:17px}
.sheet .field label{
  font-size:10px;
  letter-spacing:.18em;
  color:var(--muted);
  margin-bottom:8px;
}
.sheet .field input,
.sheet .field textarea,
.sheet .field select,
.sheet #brand,
.sheet #movement{
  min-height:52px;
  border:1px solid var(--line)!important;
  border-radius:12px!important;
  background:var(--paper)!important;
  color:var(--ink)!important;
  padding:13px 14px!important;
  outline:none;
  box-shadow:none;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.sheet .field textarea{
  min-height:118px;
  resize:vertical;
}
.sheet .field input::placeholder,
.sheet .field textarea::placeholder{
  color:#aaa7a0;
}
.sheet .field input:focus,
.sheet .field textarea:focus,
.sheet .field select:focus,
.sheet #brand:focus,
.sheet #movement:focus{
  border-color:#aaa59b!important;
  box-shadow:0 0 0 3px #00000008!important;
}
.sheet .formgrid{
  gap:4px 12px;
}
.sheet .status{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--soft);
}
.sheet .status button{
  min-height:44px;
  border:0!important;
  border-radius:10px!important;
  background:transparent!important;
  color:var(--muted)!important;
  font-size:13px;
  transition:all .18s ease;
}
.sheet .status button.active{
  background:var(--paper)!important;
  color:var(--ink)!important;
  box-shadow:0 1px 4px #00000012;
}
.sheet .photoactions{
  display:grid;
  grid-template-columns:1fr;
}
.sheet .photoactions .action{
  min-height:48px;
  border:1px solid var(--line)!important;
  border-radius:12px!important;
  background:var(--paper)!important;
  color:var(--ink)!important;
  font-size:13px;
}
.sheet .photos{
  gap:8px;
  margin-top:10px;
}
.sheet .photo{
  border-radius:10px;
  overflow:hidden;
  background:var(--soft);
}
.sheet .photo img{display:block}
.sheet .photo button{
  width:28px;height:28px;
  border:1px solid #0002;
  background:#fff;
  color:#222;
}
.sheet .field.full > div > div[style*="border-top"]{
  border-color:var(--line)!important;
}
.sheet .field.full select[onchange]{
  min-height:44px!important;
  padding:9px 12px!important;
}
.sheet .field.full input[oninput]{
  min-height:44px!important;
  margin-top:7px;
}
.sheet > .action.primary{
  width:100%;
  min-height:54px;
  border:0!important;
  border-radius:12px!important;
  margin-top:22px!important;
  font-size:14px;
  letter-spacing:.04em;
  background:var(--ink)!important;
  color:var(--bg)!important;
}
.sheet > .action.primary:active{opacity:.82}
html.dark .sheet .status button.active{
  box-shadow:0 1px 4px #0008;
}
html.dark .sheet .field input:focus,
html.dark .sheet .field textarea:focus,
html.dark .sheet .field select:focus{
  box-shadow:0 0 0 3px #ffffff0d!important;
}
@media(max-width:649px){
  .sheet .formgrid{grid-template-columns:1fr 1fr}
}
</style></head>

<script>
const SUPABASE_URL="https://brtwmzobcukyifzjnkpb.supabase.co", SUPABASE_KEY="sb_publishable_9VmErfXpK1W4RK1BhGI5vA_3-EY0oKd";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DB='watch-archive-v2',STORE='watches',BRANDS_KEY='watch-archive-brands-v1';
const DEFAULT_BRANDS=['Rolex','Omega','TAG Heuer','Tudor','Cartier','Jaeger-LeCoultre','Patek Philippe','Audemars Piguet','Vacheron Constantin','Breguet','Breitling','IWC','Zenith','Hublot','Longines','Grand Seiko','Seiko','Citizen','Casio','Timex','Bulgari','Piaget','Panerai','Hamilton','Oris','Nomos','Sinn','Tissot','Rado','Heuer'];
let watches=[],filter='owned',query='',brandFilter='',detail=null,editing=null,editPhotos=[],editStatus='owned',brands=[],currentUser=null;
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function authScreen(message=''){ $('#app').innerHTML='<main class="app"><section class="authbox"><div class="eyebrow">PERSONAL WATCH ARCHIVE</div><h1>Watch Archive</h1><p>내 시계와 사진을 여러 기기에서 안전하게 보관하려면 로그인해주세요.</p><input id="authEmail" type="email" autocomplete="email" placeholder="Email"><input id="authPassword" type="password" autocomplete="current-password" placeholder="Password"><div class="authactions"><button class="action primary" onclick="signIn()">Sign in</button><button class="action" onclick="signUp()">Create account</button></div><div class="authmsg" id="authmsg">'+esc(message)+'</div></section></main>'}
async function signIn(){let email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return toast('이메일과 비밀번호를 입력해주세요');let{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)$('#authmsg').textContent=error.message}
async function signUp(){let email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return toast('이메일과 비밀번호를 입력해주세요');if(password.length<6)return toast('비밀번호는 6자 이상이어야 합니다');let{data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:'https://qyupang.github.io/watch-archive/'}});if(error)$('#authmsg').textContent=error.message;else $('#authmsg').textContent=data.session?'가입 및 로그인 완료':'가입 완료. 이메일 인증이 필요한 경우 메일을 확인해주세요.'}
async function signOut(){await supabaseClient.auth.signOut();currentUser=null;watches=[];authScreen()}
async function loadBrands(){let saved=[];try{saved=JSON.parse(localStorage.getItem(BRANDS_KEY)||'[]')}catch(e){}let{data}=await supabaseClient.from('brands').select('name').eq('user_id',currentUser.id).order('name');brands=[...new Set([...DEFAULT_BRANDS,...saved,...(data||[]).map(x=>x.name)].filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function saveBrands(){localStorage.setItem(BRANDS_KEY,JSON.stringify(brands))}
async function addBrand(){let name=prompt('추가할 브랜드명을 입력하세요.');if(!name)return '';name=name.trim();if(!name)return '';let existing=brands.find(b=>b.toLowerCase()===name.toLowerCase());if(existing)return existing;let{error}=await supabaseClient.from('brands').insert({user_id:currentUser.id,name});if(error){toast('브랜드 저장에 실패했어요');return ''}brands.push(name);brands.sort((a,b)=>a.localeCompare(b));saveBrands();return name}
function brandOptions(selected=''){let current=selected||'';return '<option value="" '+(!current?'selected':'')+'>브랜드 선택</option>'+brands.map(b=>'<option value="'+esc(b)+'" '+(b===current?'selected':'')+'>'+esc(b)+'</option>').join('')+'<option value="__add__">＋ 새 브랜드 추가</option>'}
function brandSelect(value=''){let current=value||'';return '<div style="display:grid;grid-template-columns:1fr auto;gap:7px"><select id="brand" style="width:100%;border:1px solid var(--line);background:#fff;padding:12px" onchange="if(this.value===\'__add__\'){addBrand().then(n=>{if(n){this.innerHTML=brandOptions(n);this.value=n}else{this.innerHTML=brandOptions();this.value=\'\'}})}">'+brandOptions(current)+'</select><button type="button" class="action" style="padding:12px 14px" onclick="addBrand().then(n=>{if(n){let s=document.querySelector(\'#brand\');s.innerHTML=brandOptions(n);s.value=n}})">＋</button></div>'}
function sizeNumber(value=''){return String(value||'').replace(/mm/gi,'').trim()}
function formatSizeInput(value=''){let n=String(value||'').replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');return n?n+'mm':''}
function movementOptions(selected=''){let options=[['Manual','Manual'],['Automatic','Automatic'],['Quartz','Quartz']];if(selected&&!options.some(x=>x[0].toLowerCase()===selected.toLowerCase()))options.unshift([selected,selected]);return options.map(([v,l])=>'<option value="'+esc(v)+'" '+(v.toLowerCase()===String(selected||'').toLowerCase()?'selected':'')+'>'+esc(l)+'</option>').join('')}
function toast(x){let t=$('#toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1600)}
function imgFile(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function addFiles(input){let files=[...input.files];let a=await Promise.all(files.map(imgFile));editPhotos.push(...a.map((src,i)=>({id:uid(),src,file:files[i],cover:false,newPhoto:true,type:'watch',note:''})));input.value='';renderEditor()}
function cover(w){return w.photos?.find(p=>p.cover)?.src||w.photos?.[0]?.src||''}
async function load(){let{data,error}=await supabaseClient.from('watches').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});if(error){toast('시계 데이터를 불러오지 못했어요');return}let rows=data||[];let{data:photos}=await supabaseClient.from('watch_photos').select('*').eq('user_id',currentUser.id).order('sort_order');watches=await Promise.all(rows.map(async w=>{let ps=(photos||[]).filter(p=>p.watch_id===w.id);ps=await Promise.all(ps.map(async p=>{let{data:s}=await supabaseClient.storage.from('watch-photos').createSignedUrl(p.storage_path,3600);return{id:p.id,src:s?.signedUrl||'',path:p.storage_path,cover:p.is_cover,sortOrder:p.sort_order,type:p.photo_type||'watch',note:p.note||''}}));return{id:w.id,status:w.status,brand:w.brand,model:w.model,reference:w.reference||'',size:w.size||'',movement:w.movement||'',tags:w.tags||[],note:w.note||'',photos:ps,favorite:w.favorite,createdAt:w.created_at,updatedAt:w.updated_at}}));renderHome()}
function nav(){return`<nav class="navbar"><div class="navin"><button class="nav active" onclick="renderHome()"><span>⌚</span>Watches</button><button class="nav" onclick="photosPage()"><span>▧</span>Photos</button><button class="nav" onclick="settings()"><span>⋯</span>Settings</button></div></nav>`}
function dailyInspiration(){let pool=watches.flatMap(w=>(w.status==='archive'?(w.photos||[]).filter(p=>p?.src).map((p,i)=>({w,p,i})):[]));if(!pool.length)return "";let today=new Date();let key=`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;let hash=0;for(let i=0;i<key.length;i++)hash=(hash*31+key.charCodeAt(i))>>>0;let item=pool[hash%pool.length],ps=orderedPhotos(item.w),idx=ps.findIndex(p=>p.id===item.p.id);if(idx<0)idx=0;let day=today.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});return`<section class="inspiration"><div class="inspirationhead"><span class="inspirationeyebrow">DAILY INSPIRATION</span><span class="inspirationdate">${day}</span></div><img class="inspirationimg" src="${item.p.src}" alt="${esc(item.w.brand||'')} ${esc(item.w.model||'Watch')}" onclick="event.stopPropagation();openLightbox('${esc(item.w.id)}',${idx})"><div class="inspirationmeta" onclick="openLightbox('${esc(item.w.id)}',${idx})"><div class="inspirationbrand">${esc(item.w.brand||'BRAND')}</div><div class="inspirationmodel">${esc(item.w.model||'Untitled')}</div><div class="inspirationhint">Archive · 사진을 눌러 크게 보기</div></div></section>`}
function getBrandCounts(){let counts={};watches.filter(w=>w.status===filter).forEach(w=>{let b=(w.brand||'').trim();if(b)counts[b]=(counts[b]||0)+1});return Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0]));}
function brandFilterHtml(){let items=getBrandCounts();return '<div class="brandFilter"><div class="brandFilterLabel">BRAND</div><select class="brandFilterSelect" onchange="brandFilter=this.value;updateHomeResults()"><option value="">All Brands</option>'+items.map(([b,n])=>'<option value="'+esc(b)+'" '+(brandFilter===b?'selected':'')+'>'+esc(b)+' ('+n+')</option>').join('')+'</select></div>'}
function getFilteredWatches(){return watches.filter(w=>w.status===filter&&(!brandFilter||w.brand===brandFilter)&&(!query||JSON.stringify(w).toLowerCase().includes(query.toLowerCase())))}
function updateHomeResults(){let list=getFilteredWatches(),h=$('#homeResults');if(!h)return;h.innerHTML=list.length?'<div class="head"><h2>'+(filter==='owned'?'My Watches':'Archive')+'</h2><span class="small">'+list.length+' entries</span></div><div class="grid">'+list.map(card).join('')+'</div>':'<div class="head"><h2>'+(filter==='owned'?'My Watches':'Archive')+'</h2><span class="small">0 entries</span></div><div class="empty">검색 결과가 없어.</div>'}
function renderHome(){
if(detail){renderDetail();return}
let o=watches.filter(w=>w.status==='owned').length,a=watches.filter(w=>w.status==='archive').length;
$('#app').innerHTML='<main class="app"><div class="top"><div><div class="eyebrow">PERSONAL WATCH ARCHIVE</div><div class="brand">Watch Archive</div></div><button class="icon" onclick="settings()">⚙</button></div>'+dailyInspiration()+'<div class="tabs"><button class="tab '+(filter==='owned'?'active':'')+'" onclick="filter=\'owned\';query=\'\';renderHome()">My Watches '+o+'</button><button class="tab '+(filter==='archive'?'active':'')+'" onclick="filter=\'archive\';query=\'\';renderHome()">Archive '+a+'</button></div><input id="homeSearch" class="search" placeholder="브랜드, 모델, 레퍼런스, 태그 검색" value="'+esc(query)+'" oninput="query=this.value;updateHomeResults()">'+brandFilterHtml()+'<div class="stats"><div class="stat"><b>'+o+'</b><span>MY WATCHES</span></div><div class="stat"><b>'+a+'</b><span>ARCHIVE</span></div></div><div id="homeResults"></div></main><button class="fab" onclick="openEditor()">＋</button>'+nav();
updateHomeResults()
}
function card(w){return`<article class="card" onclick="openDetail('${w.id}')">${cover(w)?`<img class="cover" src="${cover(w)}">`:`<div class="cover"></div>`}<div class="cardbody"><div class="cardbrand">${esc(w.brand||'BRAND')}</div><div class="model">${esc(w.model||'Untitled')}</div><div class="meta">${esc(w.reference||'—')} · ${esc(w.size||'—')}</div>${w.favorite?'<span class="badge">♥ FAVORITE</span>':''}</div></article>`}
function openDetail(id){detail=id;renderDetail()}function closeDetail(){detail=null;renderHome()}
function orderedPhotos(w){let ps=[...(w.photos||[])];if(!ps.length)return[];let i=ps.findIndex(p=>p.cover);if(i>0){let c=ps.splice(i,1)[0];ps.unshift(c)}return ps}
let zoomState={scale:1,x:0,y:0,pinchStart:0,startScale:1,startX:0,startY:0,lastX:0,lastY:0,lastTap:0};
function resetZoom(){zoomState={scale:1,x:0,y:0,pinchStart:0,startScale:1,startX:0,startY:0,lastX:0,lastY:0,lastTap:0};let t=$('#lightboxTrack');t?.classList.remove('zoomActive');t?.querySelectorAll('.lightboxSlide').forEach(s=>s.classList.remove('zoomed'));t?.querySelectorAll('img').forEach(img=>img.style.transform='translate3d(0,0,0) scale(1)')}
function applyZoom(){let slide=activeZoomSlide(),img=slide?.querySelector('img');if(!img)return;img.style.transform=`translate3d(${zoomState.x}px,${zoomState.y}px,0) scale(${zoomState.scale})`;slide.classList.toggle('zoomed',zoomState.scale>1.01);$('#lightboxTrack')?.classList.toggle('zoomActive',zoomState.scale>1.01)}
function activeZoomSlide(){let t=$('#lightboxTrack');if(!t)return null;let n=Math.round(t.scrollLeft/t.clientWidth);return t.children[n]}
function zoomDoubleTap(e){let now=Date.now();if(now-zoomState.lastTap<300){zoomState.scale=zoomState.scale>1.01?1:2.2;zoomState.x=0;zoomState.y=0;applyZoom()}zoomState.lastTap=now}
function zoomTouchStart(e){let slide=e.currentTarget;if(e.touches.length===2){e.preventDefault();zoomState.pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoomState.startScale=zoomState.scale;return}if(e.touches.length===1&&zoomState.scale>1.01){e.preventDefault();zoomState.startX=e.touches[0].clientX;zoomState.startY=e.touches[0].clientY;zoomState.lastX=zoomState.x;zoomState.lastY=zoomState.y}}
function zoomTouchMove(e){if(e.touches.length===2){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);let ratio=d/zoomState.pinchStart;let delta=ratio-1;let sensitivity=0.55;zoomState.scale=Math.max(1,Math.min(3,zoomState.startScale*(1+delta*sensitivity)));applyZoom();return}if(e.touches.length===1&&zoomState.scale>1.01){e.preventDefault();zoomState.x=zoomState.lastX+(e.touches[0].clientX-zoomState.startX);zoomState.y=zoomState.lastY+(e.touches[0].clientY-zoomState.startY);applyZoom()}}
function zoomTouchEnd(e){if(e.touches.length===0&&zoomState.scale<=1.01){zoomState.scale=1;applyZoom()}}
function bindZoom(){let t=$('#lightboxTrack');if(!t)return;t.querySelectorAll('.lightboxSlide').forEach(slide=>{slide.addEventListener('touchstart',zoomTouchStart,{passive:false});slide.addEventListener('touchmove',zoomTouchMove,{passive:false});slide.addEventListener('touchend',zoomTouchEnd,{passive:false});slide.addEventListener('dblclick',zoomDoubleTap)});t.addEventListener('scroll',()=>{if(zoomState.scale<=1.01){resetZoom();updateLightboxCount()}},{passive:true})}
function openLightbox(id,index=0){let w=watches.find(x=>x.id===id);if(!w||!w.photos?.length)return;let ps=orderedPhotos(w);closeLightbox();$('#app').insertAdjacentHTML('beforeend',`<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()"><button class="lightboxClose" onclick="closeLightbox()">×</button><div class="lightboxTrack" id="lightboxTrack">${ps.map(p=>`<div class="lightboxSlide"><img src="${p.src}" alt="Watch photo"></div>`).join('')}</div><div class="lightboxHint" id="lightboxHint">Pinch to zoom · Double tap</div><div class="lightboxCount" id="lightboxCount">${index+1} / ${ps.length}</div></div>`);let t=$('#lightboxTrack');requestAnimationFrame(()=>{t.scrollLeft=t.clientWidth*Math.max(0,Math.min(index,ps.length-1));resetZoom();bindZoom();updateLightboxCount();setTimeout(()=>$('#lightboxHint')?.remove(),1800)})}
function updateLightboxCount(){let t=$('#lightboxTrack');if(!t)return;let n=Math.round(t.scrollLeft/t.clientWidth);$('#lightboxCount').textContent=`${n+1} / ${t.children.length}`;if(zoomState.scale<=1.01)resetZoom()}
function closeLightbox(){$('#lightbox')?.remove();zoomState.scale=1}
function renderHero(w){let ps=orderedPhotos(w);if(!ps.length)return '';return`<div class="heroGallery"><div class="heroTrack" id="heroTrack" onscroll="updateHeroDots()">${ps.map(p=>`<div class="heroSlide"><img src="${p.src}" onclick="openLightbox('${w.id}',${ps.indexOf(p)})"></div>`).join('')}</div><div class="heroCount">${ps.length} photo${ps.length>1?'s':''}</div>${ps.length>1?`<div class="heroDots">${ps.map((_,i)=>`<button class="heroDot ${i===0?'active':''}" onclick="heroTo(${i})"></button>`).join('')}</div>`:''}</div>`}
function heroTo(i){let t=$('#heroTrack');if(t)t.scrollTo({left:t.clientWidth*i,behavior:'smooth'})}
function updateHeroDots(){let t=$('#heroTrack');if(!t)return;let i=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('.heroDot').forEach((d,n)=>d.classList.toggle('active',n===i))}
function photoTypeLabel(t){return ({watch:'WATCH',wrist:'WRIST SHOT',detail:'DETAIL',movement:'MOVEMENT',strap:'STRAP',lifestyle:'LIFESTYLE'})[t]||'WATCH'}
function renderDetail(){
 let idx=watches.findIndex(x=>x.id===detail);
 if(idx<0)return closeDetail();
 let scoped=watches.filter(x=>x.status===filter);
 let idxInScope=scoped.findIndex(x=>x.id===detail);
 if(idxInScope<0){scoped=watches;idxInScope=scoped.findIndex(x=>x.id===detail)}
 let w=watches[idx], prev=scoped[(idxInScope-1+scoped.length)%scoped.length], next=scoped[(idxInScope+1)%scoped.length];
 $('#app').innerHTML=`<main class="detail" id="detailSwipe">${cover(w)?`<div class="heroWrap"><img class="hero" src="${cover(w)}"><div class="watchPager">${idxInScope+1} / ${scoped.length}</div></div>`:''}<div class="detailpad"><button class="icon" onclick="closeDetail()">←</button><div class="detailbrand">${esc(w.brand||'BRAND')}</div><div class="detailmodel">${esc(w.model||'Untitled')}</div><div class="pills">${[['Ref.',w.reference],['Size',w.size],['Year',w.year],['Movement',w.movement]].filter(x=>x[1]).map(x=>`<span class="pill">${esc(x[0])} ${esc(x[1])}</span>`).join('')}</div>${w.note?`<div class="head"><h2>My Note</h2></div><div class="note">${esc(w.note)}</div>`:''}${w.photos?.some(p=>p.note)?`<div class="head"><h2>Photo Notes</h2></div>${w.photos.filter(p=>p.note).map(p=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--line)">${photoTypeLabel(p.type)} · ${esc(p.note)}</div>`).join('')}`:''}${w.tags?.length?`<div class="pills" style="margin:16px 0">${w.tags.map(t=>`<span class="pill">#${esc(t)}</span>`).join('')}</div>`:''}<div class="head"><h2>Photos</h2><span class="small">${w.photos.length}</span></div><div class="detailphotos">${w.photos.map((p,i)=>`<button type="button" onclick="openLightbox('${w.id}',${i})"><img src="${p.src}" alt="Watch photo"><span style="position:absolute;left:5px;bottom:5px;background:#111b;color:#fff;padding:3px 5px;font-size:8px">${photoTypeLabel(p.type)}</span></button>`).join('')}</div><div class="actions"><button onclick="openEditor(watches.find(x=>x.id==='${w.id}'))">Edit</button><button onclick="favorite('${w.id}')">${w.favorite?'♥ Favorite':'♡ Favorite'}</button><button onclick="delWatch('${w.id}')" class="delete">Delete</button></div><div class="watchNav"><button onclick="openDetail('${prev.id}')">← Previous</button><button onclick="openDetail('${next.id}')">Next →</button></div></div></main>`;
 const area=document.getElementById('detailSwipe');
 if(area){let sx=0,sy=0,st=0;area.addEventListener('touchstart',e=>{let t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});area.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;if(dt<700&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.25)openDetail(dx<0?next.id:prev.id)},{passive:true})}
}
async function favorite(id){let w=watches.find(x=>x.id===id);if(!w)return;let{error}=await supabaseClient.from('watches').update({favorite:!w.favorite}).eq('id',id).eq('user_id',currentUser.id);if(error)return toast('저장에 실패했어요');await load()}
async function delWatch(id){if(!confirm('이 시계를 삭제할까요?'))return;let w=watches.find(x=>x.id===id);if(w?.photos?.length)await supabaseClient.storage.from('watch-photos').remove(w.photos.map(p=>p.path).filter(Boolean));let{error}=await supabaseClient.from('watches').delete().eq('id',id).eq('user_id',currentUser.id);if(error){toast('삭제에 실패했어요');return}detail=null;await load();toast('삭제했어요')}
function openEditor(w=null){editing=w?.id||null;editPhotos=w?JSON.parse(JSON.stringify(w.photos||[])):[];editStatus=w?.status||filter;renderEditor()}
function setStatus(s){editStatus=s;renderEditor()}
function renderEditor(){let w=editing?watches.find(x=>x.id===editing):null;$('#app').innerHTML=`<div class="overlay"><section class="sheet"><div class="sheettop"><h1 class="title">${w?'Edit Watch':'New Watch'}</h1><button class="close" onclick="renderHome()">×</button></div><div class="field"><label>Photos</label><div class="photoactions"><button class="action" onclick="$('#gallery').click()">＋ 사진 보관함에서 추가</button></div><input id="gallery" class="hidden" type="file" accept="image/*" multiple onchange="addFiles(this)"><div class="photos">${editPhotos.map((p,i)=>`<div class="photo"><img src="${p.src}"><button onclick="editPhotos.splice(${i},1);renderEditor()">×</button>${p.cover?'<span class="covermark">COVER</span>':''}</div>`).join('')}</div></div><div class="field"><label>Collection</label><div class="status"><button class="${editStatus==='owned'?'active':''}" onclick="setStatus('owned')">My Watch</button><button class="${editStatus==='archive'?'active':''}" onclick="setStatus('archive')">Archive</button></div></div><div class="formgrid"><div class="field"><label>Brand</label>${brandSelect(w?.brand||'')}</div><div class="field"><label>Model</label><input id="model" value="${esc(w?.model)}" placeholder="Oyster Perpetual Date"></div><div class="field"><label>Reference</label><input id="reference" value="${esc(w?.reference)}" placeholder="1500"></div><div class="field"><label>Size</label><input id="size" type="text" inputmode="numeric" autocomplete="off" value="${esc(sizeNumber(w?.size||''))}" placeholder="34"></div><div class="field"><label>Movement</label><select id="movement" style="width:100%;border:1px solid var(--line);background:#fff;padding:12px">${movementOptions(w?.movement||'')}</select></div><div class="field full"><label>Tags</label><input id="tags" value="${esc(w?.tags?.join(', '))}" placeholder="vintage, silver dial, 34mm"></div><div class="field full"><label>My Note</label><textarea id="note">${esc(w?.note)}</textarea></div></div><div class="field full"><label>PHOTO DETAILS</label><div class="small">각 사진의 종류와 메모를 설정할 수 있어.</div><div style="margin-top:10px">${editPhotos.map((p,i)=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div style="display:flex;gap:8px;align-items:center"><img src="${p.src}" style="width:52px;height:52px;object-fit:cover"><select onchange="editPhotos[${i}].type=this.value" style="flex:1"><option value="watch" ${(p.type||'watch')==='watch'?'selected':''}>Watch</option><option value="wrist" ${p.type==='wrist'?'selected':''}>Wrist Shot</option><option value="detail" ${p.type==='detail'?'selected':''}>Detail</option><option value="movement" ${p.type==='movement'?'selected':''}>Movement</option><option value="strap" ${p.type==='strap'?'selected':''}>Strap</option><option value="lifestyle" ${p.type==='lifestyle'?'selected':''}>Lifestyle</option></select></div><input style="margin-top:7px" value="${esc(p.note||'')}" placeholder="이 사진에 대한 메모" oninput="editPhotos[${i}].note=this.value"></div>`).join('')}</div></div><button class="action primary" style="margin-top:16px" onclick="save()">Save Watch</button></section></div>`}
function normalizeSizeValue(v){
 v=String(v||'').trim().replace(/mm/gi,'').trim();
 return v ? v+'mm' : '';
}
function normalizeSizeField(){
 const el=document.getElementById('size');
 if(el) el.value=normalizeSizeValue(el.value);
}
async function save(){let old=editing?watches.find(x=>x.id===editing):null;if(!$('#brand').value.trim()||!$('#model').value.trim())return toast('브랜드와 모델을 입력해주세요');if(editPhotos.length&&!editPhotos.some(p=>p.cover))editPhotos[0].cover=true;let watchId=old?.id||uid();let payload={id:watchId,user_id:currentUser.id,status:editStatus,brand:$('#brand').value.trim(),model:$('#model').value.trim(),reference:$('#reference').value.trim(),size:formatSizeInput($('#size').value),movement:$('#movement').value,tags:$('#tags').value.split(',').map(s=>s.trim()).filter(Boolean),note:$('#note').value.trim(),favorite:old?.favorite||false};let{error}=old?await supabaseClient.from('watches').update(payload).eq('id',watchId).eq('user_id',currentUser.id):await supabaseClient.from('watches').insert(payload);if(error){toast('시계 저장에 실패했어요');return}let oldPaths=new Set((old?.photos||[]).map(p=>p.path).filter(Boolean)),keptPaths=new Set();for(let i=0;i<editPhotos.length;i++){let p=editPhotos[i],path=p.path;if(!path){let ext=(p.src.match(/^data:image\/([^;]+)/)||[])[1]||'jpeg';ext=ext==='jpeg'?'jpg':ext;path=currentUser.id+'/'+watchId+'/'+p.id+'.'+ext;let blob=p.file||await(await fetch(p.src)).blob();let up=await supabaseClient.storage.from('watch-photos').upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'3600',upsert:false});if(up.error){toast('사진 업로드에 실패했어요');return}}keptPaths.add(path);let{error:pe}=await supabaseClient.from('watch_photos').upsert({id:p.id,user_id:currentUser.id,watch_id:watchId,storage_path:path,is_cover:!!p.cover,sort_order:i,photo_type:p.type||'watch',note:p.note||null});if(pe){toast('사진 정보 저장에 실패했어요');return}}let removed=[...oldPaths].filter(x=>!keptPaths.has(x));if(removed.length){await supabaseClient.storage.from('watch-photos').remove(removed);await supabaseClient.from('watch_photos').delete().eq('watch_id',watchId).eq('user_id',currentUser.id).in('storage_path',removed)}editing=null;await load();toast(old?'수정했어요':'저장했어요')}
function photosPage(){let a=watches.flatMap(w=>w.photos.map(p=>({w,p})));$('#app').innerHTML=`<main class="app"><div class="top"><div><div class="eyebrow">ALL PHOTOS</div><div class="brand">Photos</div></div></div>${a.length?`<div class="grid">${a.map(x=>`<article class="card" onclick="openDetail('${x.w.id}')"><img class="cover" src="${x.p.src}"><div class="cardbody"><div class="cardbrand">${esc(x.w.brand)}</div><div class="meta">${esc(x.w.model)}</div></div></article>`).join('')}</div>`:'<div class="empty">아직 사진이 없어.</div>'}</main>${nav()}`}
function settings(){const email=esc(currentUser?.email||'');$('#app').innerHTML='<main class="app"><div class="top"><div><div class="eyebrow">ARCHIVE TOOLS</div><div class="brand">Settings</div></div></div><div class="head"><h2>Account</h2></div><div class="empty">Supabase Cloud Archive<br><span class="small">'+email+'</span><br><br><button class="action" onclick="signOut()">Sign out</button></div></main>'+nav()}
function updateTheme(){let h=new Date().getHours();let dark=h>=21||h<8;document.documentElement.classList.toggle('dark',dark);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#171614':'#f5f3ee')}
function scheduleTheme(){updateTheme();let now=new Date(),next=new Date(now);next.setMinutes(0,0,0);next.setHours(now.getHours()+1);let ms=next-now;setTimeout(()=>{updateTheme();scheduleTheme()},Math.max(ms,1000))}
scheduleTheme();
async function boot(){let{data}=await supabaseClient.auth.getSession();currentUser=data.session?.user||null;if(!currentUser){authScreen();return}await loadBrands();await load()}supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;if(currentUser){loadBrands().then(load)}else authScreen()});boot();
</script></body></html>
