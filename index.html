/* Portfolio editorial dashboard refresh */

.timeline-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;margin:10px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.timeline-filter-label{font:19px Georgia,'Times New Roman',serif}
.timeline-sort-control{display:flex;align-items:center;gap:3px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:99px}
.timeline-sort-control button{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;white-space:nowrap;padding:9px 11px;border-radius:99px;cursor:pointer}
.timeline-sort-control button.active{background:var(--ink);color:var(--bg)}
@media(max-width:380px){.timeline-toolbar{gap:8px}.timeline-filter-label{font-size:17px}.timeline-sort-control button{font-size:10px;padding:9px 8px}}

.portfolio-page{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.portfolio-page-top{align-items:flex-end;margin-bottom:20px}
.portfolio-piece-count{font-size:10px;letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.portfolio-hero{position:relative;overflow:hidden;padding:25px 22px 20px;margin-bottom:12px;background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.portfolio-hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid currentColor;border-radius:50%;right:-82px;top:-76px;opacity:.12;box-shadow:0 0 0 18px transparent,0 0 0 19px currentColor,0 0 0 38px transparent,0 0 0 39px currentColor}
.portfolio-hero-label,.portfolio-hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:9px;letter-spacing:.13em;opacity:.75}
.portfolio-live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a4b9a6;margin-right:7px}
.portfolio-hero-title{font:clamp(30px,8vw,42px)/1.02 Georgia,'Times New Roman',serif;letter-spacing:-.045em;margin-top:27px;position:relative;z-index:1}
.portfolio-hero-caption{font-size:12px;line-height:1.7;opacity:.7;margin:12px 0 27px;position:relative;z-index:1}
.portfolio-hero-total-label{font-size:9px;letter-spacing:.14em;opacity:.7}
.portfolio-hero-total{font:clamp(29px,7vw,39px)/1.15 Georgia,'Times New Roman',serif;letter-spacing:-.035em;overflow-wrap:anywhere;margin:5px 0 18px}
.portfolio-hero-foot{border-top:1px solid currentColor;padding-top:12px;opacity:.65}
.portfolio-metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:26px}
.portfolio-metric-card{min-width:0;padding:16px 14px 15px;border:1px solid var(--line);background:var(--paper)}
.portfolio-metric-label{display:block;color:var(--muted);font-size:11px}
.portfolio-metric-card strong{display:block;margin:10px 0 7px;font-size:clamp(17px,4.5vw,22px);line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.portfolio-metric-note{display:block;color:var(--muted);font-size:10px;line-height:1.5}
.portfolio-section{margin-top:28px}
.portfolio-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:13px}
.portfolio-section-head h2{font:26px/1.1 Georgia,'Times New Roman',serif;letter-spacing:-.035em;margin:5px 0 0}
.portfolio-section-kicker{font-size:9px;letter-spacing:.15em;color:var(--muted)}
.portfolio-ranking{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}
.portfolio-rank-card{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
.portfolio-rank-number{font:12px Georgia,serif;color:var(--muted);width:18px;flex:0 0 18px}
.portfolio-rank-photo{width:62px;height:68px;object-fit:cover;flex:0 0 62px;background:var(--soft);border-radius:2px}
.portfolio-rank-content{flex:1;min-width:0}
.portfolio-rank-model{font:19px/1.15 Georgia,'Times New Roman',serif;margin-top:4px;overflow-wrap:anywhere}
.portfolio-rank-meter{height:3px;background:var(--soft);margin-top:10px;overflow:hidden}
.portfolio-rank-meter span{display:block;height:100%;background:var(--ink)}
.portfolio-rank-value{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right;max-width:42%;min-width:78px}
.portfolio-rank-value strong{font-size:12px;overflow-wrap:anywhere}
.portfolio-rank-value span{font-size:10px;color:var(--muted)}
.portfolio-cost-details{margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.portfolio-cost-details summary{display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;cursor:pointer;padding:16px 0}
.portfolio-cost-details summary::-webkit-details-marker{display:none}
.portfolio-cost-details summary>span:first-child{display:flex;flex-direction:column;gap:5px}
.portfolio-cost-details summary strong{font:21px Georgia,'Times New Roman',serif}
.portfolio-cost-summary{font-size:13px;font-weight:600;white-space:nowrap}
.portfolio-cost-summary span{color:var(--muted);margin-left:5px}
.portfolio-cost-details[open] .portfolio-cost-summary span{display:inline-block;transform:rotate(45deg)}
.portfolio-cost-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:14px}
.portfolio-cost-grid>div{display:flex;flex-direction:column;gap:7px;min-width:0;background:var(--paper);padding:13px 11px}
.portfolio-cost-grid>div>span{font-size:10px;color:var(--muted)}
.portfolio-cost-grid strong{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.portfolio-cost-grid small{font-size:10px;color:var(--muted);line-height:1.5}
.portfolio-gallery-section{margin-top:32px}
.portfolio-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 11px}
.portfolio-gallery-card{display:flex;flex-direction:column;text-align:left;min-width:0;padding:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0;overflow:hidden;cursor:pointer}
.portfolio-gallery-image{position:relative;aspect-ratio:4/4.6;background:var(--soft);overflow:hidden}
.portfolio-gallery-image img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.portfolio-gallery-card:active .portfolio-gallery-image img{transform:scale(1.025)}
.portfolio-gallery-placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font:11px/1.7 Georgia,serif;letter-spacing:.15em;color:var(--muted)}
.portfolio-gallery-index{position:absolute;left:8px;bottom:8px;padding:5px 6px;background:var(--bg);color:var(--ink);font-size:8px;letter-spacing:.08em}
.portfolio-gallery-info{padding:12px 11px 13px;min-width:0}
.portfolio-gallery-model{font:19px/1.18 Georgia,'Times New Roman',serif;margin-top:5px;overflow-wrap:anywhere}
.portfolio-gallery-ref{font-size:10px;color:var(--muted);margin-top:5px;min-height:13px;overflow-wrap:anywhere}

const photoUrlCache=new Map();
const watchImageObjectUrls=new Map();
let watchImageDbPromise=null;
function openWatchImageDb(){
 if(!('indexedDB'in window))return Promise.resolve(null);
 if(watchImageDbPromise)return watchImageDbPromise;
 watchImageDbPromise=new Promise(resolve=>{
  try{const req=indexedDB.open('watch-archive-image-cache',2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('images'))db.createObjectStore('images',{keyPath:'path'});if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots',{keyPath:'userId'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)}catch(e){resolve(null)}
 });
 return watchImageDbPromise;
}
async function readWatchDataSnapshot(userId){
 const db=await openWatchImageDb();if(!db||!userId)return null;
 return new Promise(resolve=>{try{const req=db.transaction('snapshots','readonly').objectStore('snapshots').get(String(userId));req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)}catch(e){resolve(null)}});
}
async function writeWatchDataSnapshot(userId,rows,photoRows){
 const db=await openWatchImageDb();if(!db||!userId)return;
 try{await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').put({userId:String(userId),rows,photoRows,savedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}catch(e){console.warn('Watch data cache write skipped',e)}
}
async function getCachedWatchImage(path){
 if(!path)return null;const db=await openWatchImageDb();if(!db)return null;
 return new Promise(resolve=>{try{const tx=db.transaction('images','readonly'),req=tx.objectStore('images').get(path);req.onsuccess=()=>resolve(req.result?.blob instanceof Blob?req.result.blob:null);req.onerror=()=>resolve(null)}catch(e){resolve(null)}});
}
async function cacheWatchImage(path,blob){
 if(!path||!(blob instanceof Blob)||!blob.size)return;
 const db=await openWatchImageDb();if(!db)return;
 try{await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put({path,blob,size:blob.size,savedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}catch(e){console.warn('Image cache write skipped',e)}
}
async function loadWatchImageFromCache(path){
 const blob=await getCachedWatchImage(path);if(!blob)return '';
 let url=watchImageObjectUrls.get(path);if(!url){url=URL.createObjectURL(blob);watchImageObjectUrls.set(path,url)}return url;
}
async function cacheWatchImageFromUrl(path,url){
 try{const response=await fetch(url,{mode:'cors',cache:'force-cache'});if(!response.ok)return;const blob=await response.blob();await cacheWatchImage(path,blob)}catch(e){}
}
async function refreshPhotoUrl(path,force=false){
  if(!path)return '';
  const cached=photoUrlCache.get(path);
  if(!force&&cached?.url&&cached.expiresAt>Date.now()+60000)return cached.url;
  const{data,error}=await supabaseClient.storage.from('watch-photos').createSignedUrls([path],86400);
  const url=data?.[0]?.signedUrl||'';
  if(!error&&url){
    photoUrlCache.set(path,{url,expiresAt:Date.now()+23*60*60*1000});
    return url;
  }
  return '';
}
async function retryImage(img,force=false){
  if(!img||!img.dataset.photoPath||img.dataset.retrying==='true')return;
  clearTimeout(img._coverLoadTimer);
  const tries=Number(img.dataset.imageRetry||0);
  if(tries>=3){finishCoverImage(img,false);return;}
  img.dataset.retrying='true';
  img.dataset.imageRetry=String(tries+1);
  await new Promise(r=>setTimeout(r,[250,700,1400][tries]||1800));
  try{
    // Request a fresh signed URL and restart images that have stalled without firing onerror.
    const url=await refreshPhotoUrl(img.dataset.photoPath,true);
    if(url){
      img.onload=()=>{clearTimeout(img._coverLoadTimer);img.dataset.imageRetry='0';img.dataset.retrying='false';finishCoverImage(img,true);};
      img.onerror=()=>{img.dataset.retrying='false';retryImage(img);};
      img.src='';img.src=url;
      watchCoverLoad(img);
      return;
    }
  }catch(e){}
  img.dataset.retrying='false';watchCoverLoad(img);
}
function watchCoverLoad(img){
  if(!img?.closest('.cover-frame'))return;
  clearTimeout(img._coverLoadTimer);
  img._coverLoadTimer=setTimeout(()=>{
    if(img.naturalWidth>0){finishCoverImage(img,true);return;}
    retryImage(img,true);
  },8000);
}
function finishCoverImage(img,ok){
  const frame=img?.closest('.cover-frame');
  if(!frame)return;
  frame.classList.remove('is-loading');
  frame.classList.toggle('is-loaded',!!ok);
  frame.classList.toggle('is-error',!ok);
}
function photoAttrs(p,extra=''){
  return 'src="'+esc(p?.src||'')+'" data-photo-path="'+esc(p?.path||'')+'" onload="finishCoverImage(this,true)" onerror="retryImage(this)" decoding="async" '+extra;
}
function applyWatchRows(rows,photoRows){
 const paths=[...new Set(photoRows.map(p=>p.storage_path).filter(Boolean))];
 watches=rows.map(w=>{
  let ps=photoRows.filter(p=>p.watch_id===w.id).map(p=>({id:p.id,src:photoUrlCache.get(p.storage_path)?.url||'',path:p.storage_path,cover:p.is_cover,sortOrder:p.sort_order,type:p.photo_type||'watch',note:p.note||''}));
  return{id:w.id,status:w.status,brand:w.brand,model:w.model,reference:w.reference||'',size:w.size||'',movement:w.movement||'',current_value:w.current_value??null,valuation_date:w.valuation_date||'',valuation_source:w.valuation_source||'',purchase_price:w.purchase_price??null,purchase_source:w.purchase_source||'domestic',customs_duty:Number(w.customs_duty)||0,sale_price:w.sale_price??null,sale_date:w.sale_date||'',sale_reason:w.sale_reason||'',possession_status:w.possession_status||'held',purchase_date:w.purchase_date||'',purchase_reason:w.purchase_reason||'',overhaul_date:w.overhaul_date||'',repair_history:Array.isArray(w.repair_history)?w.repair_history:[],tags:w.tags||[],note:w.note||'',photos:ps,favorite:w.favorite,createdAt:w.created_at,updatedAt:w.updated_at};
 });
 watchRandomRank=new Map(watches.map(w=>[w.id,Math.random()]));
 return paths;
}
async function hydrateCachedPhotoElements(root=document){
 const imgs=[...root.querySelectorAll('img[data-photo-path]')];
 await Promise.all(imgs.map(async img=>{const path=img.dataset.photoPath;if(!path)return;const cached=await loadWatchImageFromCache(path);if(!cached||!img.isConnected)return;
  if(img.dataset.lazySrc!==undefined){img.dataset.lazySrc=cached;img.dataset.lazyBound='0';img.dataset.lazyLoaded='0';img.dataset.lazyLoading='0';activateLazyImages(img.parentElement||root)}
  else if(img.getAttribute('src')!==cached){img.src=cached}
 }));
}
async function load(){
 const loadStarted=performance.now(),userId=currentUser?.id;
 if(!userId)return;
 // Paint the last saved snapshot immediately; the server refresh below remains authoritative.
 const snapshot=await readWatchDataSnapshot(userId);
 if(currentUser?.id!==userId)return;
 if(snapshot&&Array.isArray(snapshot.rows)&&Array.isArray(snapshot.photoRows)){
  applyWatchRows(snapshot.rows,snapshot.photoRows);
  renderHome();
  hydrateCachedPhotoElements(document).catch(()=>{});
  window.__watchArchivePerf={source:'indexedDB-cache',cacheAgeMs:Math.max(0,Date.now()-(snapshot.savedAt||Date.now())),photoCount:snapshot.photoRows.length};
 }
 const {data,error}=await supabaseClient.from('watches').select('*').eq('user_id',userId).order('created_at',{ascending:false});
 if(error){if(!snapshot)toast('시계 데이터를 불러오지 못했어요');else console.warn('Refresh failed; showing cached watches',error);return}
 const rows=data||[];
 const {data:photos,error:photoError}=await supabaseClient.from('watch_photos').select('*').eq('user_id',userId).order('sort_order');
 if(photoError){if(!snapshot)toast('사진 정보를 불러오지 못했어요');return}
 const photoRows=photos||[];
 if(currentUser?.id!==userId)return;
 await writeWatchDataSnapshot(userId,rows,photoRows);
 const paths=applyWatchRows(rows,photoRows);
 renderHome();
 window.__watchArchivePerf={source:'supabase-refreshed',dataReadyMs:Math.round(performance.now()-loadStarted),photoCount:paths.length,photoUrlsReadyMs:null};
 if(paths.length){
  try{
   const {data:signed,error:signedError}=await supabaseClient.storage.from('watch-photos').createSignedUrls(paths,86400);
   const signedByPath=new Map();
   if(!signedError)(signed||[]).forEach((item,i)=>{if(item?.signedUrl){signedByPath.set(paths[i],item.signedUrl);photoUrlCache.set(paths[i],{url:item.signedUrl,expiresAt:Date.now()+23*60*60*1000})}});
   const missing=paths.filter(path=>!signedByPath.has(path));
   await Promise.all(missing.map(async path=>{const url=await refreshPhotoUrl(path,true);if(url)signedByPath.set(path,url)}));
   watches.forEach(w=>(w.photos||[]).forEach(p=>{if(!p.src&&signedByPath.has(p.path))p.src=signedByPath.get(p.path)}));
   document.querySelectorAll('img[data-photo-path]').forEach(img=>{
    const path=img.dataset.photoPath,url=signedByPath.get(path)||photoUrlCache.get(path)?.url;
    if(!url)return;
    if(img.dataset.lazySrc!==undefined){if(!img.dataset.lazySrc.startsWith('blob:'))img.dataset.lazySrc=url;img.dataset.lazyBound='0'}
    else if(!img.getAttribute('src')||img.getAttribute('src')!==url){img.src=url}
   });
   activateLazyImages(document);
   window.__watchArchivePerf.photoUrlsReadyMs=Math.round(performance.now()-loadStarted);
  }catch(e){console.warn('Photo URL preparation failed',e)}
 }
}

function formatWon(v){return Number(v||0).toLocaleString('ko-KR')+'원'}
function allocationDonutHtml(items,total,kind){
 if(!items.length||total<=0)return '';
 const palette=['#272622','#77736b','#b5a994','#d8d1c4','#9d8065','#52645b','#8799a1','#b08b8b','#a7a7a0','#6f5c7a'];
 const sorted=items.slice().sort((a,b)=>b.amount-a.amount);
 const shown=sorted.slice(0,7).map((item,i)=>({...item,color:palette[i%palette.length]}));
 if(sorted.length>7){const rest=sorted.slice(7).reduce((sum,item)=>sum+item.amount,0);shown.push({name:'기타 '+(sorted.length-7)+'개',amount:rest,color:palette[7]});}
 let cursor=0;
 const stops=shown.map(item=>{const start=cursor;cursor+=item.amount/total*100;return item.color+' '+start.toFixed(3)+'% '+cursor.toFixed(3)+'%'}).join(',');
 const legend=shown.map(item=>'<div class="allocation-legend-row"><span class="allocation-dot" style="background:'+item.color+'"></span><span class="allocation-legend-name">'+esc(item.name)+'</span><strong>'+((item.amount/total)*100).toFixed(1)+'%</strong></div>').join('');
 return '<div class="allocation-chart-wrap"><div class="allocation-donut" role="img" aria-label="'+esc(kind)+' 비중 도넛 차트" style="background:conic-gradient('+stops+')"><div class="allocation-donut-hole"><span>합산 금액</span><strong>'+formatWon(total)+'</strong></div></div><div class="allocation-legend">'+legend+'</div></div>';
}
function brandAnalysisHtml(held){
 const grouped=new Map();
 held.forEach(w=>{
  const brand=String(w.brand||'브랜드 미등록').trim()||'브랜드 미등록';
  if(!grouped.has(brand))grouped.set(brand,{brand,watches:[],allocationValue:0,valuedCount:0,costFallbackCount:0,pnl:0,pnlBase:0,comparableCount:0});
  const g=grouped.get(brand);g.watches.push(w);
  const hasValue=w.current_value!==null&&w.current_value!==''&&Number.isFinite(Number(w.current_value))&&Number(w.current_value)>=0;
  const hasCost=w.purchase_price!==null&&w.purchase_price!==''&&Number.isFinite(Number(w.purchase_price))&&Number(w.purchase_price)>=0;
  if(hasValue){g.allocationValue+=Number(w.current_value);g.valuedCount++}
  else if(hasCost){g.allocationValue+=Number(w.purchase_price);g.costFallbackCount++}
  if(hasValue&&hasCost&&Number(w.purchase_price)>0){g.pnl+=Number(w.current_value)-Number(w.purchase_price);g.pnlBase+=Number(w.purchase_price);g.comparableCount++}
 });
 const watchRows=held.map(w=>{
  const hasValue=w.current_value!==null&&w.current_value!==''&&Number.isFinite(Number(w.current_value))&&Number(w.current_value)>=0;
  const hasCost=w.purchase_price!==null&&w.purchase_price!==''&&Number.isFinite(Number(w.purchase_price))&&Number(w.purchase_price)>=0;
  return {watch:w,amount:hasValue?Number(w.current_value):(hasCost?Number(w.purchase_price):null),source:hasValue?'평가금액':'구매금액'};
 }).filter(item=>item.amount!==null).sort((a,b)=>b.amount-a.amount);
 const watchTotal=watchRows.reduce((sum,item)=>sum+item.amount,0);
 const watchDonutHtml=allocationDonutHtml(watchRows.map(item=>({name:(item.watch.brand||'브랜드 미등록')+' · '+(item.watch.model||'모델 미등록'),amount:item.amount})),watchTotal,'시계별');
 const watchRowHtml=item=>{
  const w=item.watch,share=watchTotal?item.amount/watchTotal*100:0;
  return '<div class="brand-analysis-row"><div class="brand-analysis-main"><div class="brand-analysis-name">'+esc(w.brand||'브랜드 미등록')+' · '+esc(w.model||'모델 미등록')+'</div><div class="brand-analysis-sub">'+share.toFixed(1)+'% · '+item.source+'</div><div class="brand-analysis-bar"><span style="width:'+Math.max(0,Math.min(100,item.amount/Math.max(1,...watchRows.map(x=>x.amount))*100))+'%"></span></div></div><div class="brand-analysis-pnl"><strong>'+formatWon(item.amount)+'</strong></div></div>';
 };
 const topWatchRows=watchRows.slice(0,5).map(watchRowHtml).join('');
 const remainingWatchRows=watchRows.slice(5).map(watchRowHtml).join('');
 const watchListHtml=watchRows.length?'<div class="brand-analysis-list">'+topWatchRows+'</div>'+(remainingWatchRows?'<details class="analysis-details"><summary>나머지 시계 '+(watchRows.length-5)+'개 보기</summary><div class="brand-analysis-list">'+remainingWatchRows+'</div></details>':''):'<div class="brand-analysis-empty">구매금액 또는 현재 평가금액을 등록하면 시계별 비중을 확인할 수 있어.</div>';
 const groups=[...grouped.values()];
 const totalValue=groups.reduce((sum,g)=>sum+g.allocationValue,0);
 const allocation=groups.filter(g=>g.allocationValue>0).sort((a,b)=>b.allocationValue-a.allocationValue);
 const brandDonutHtml=allocationDonutHtml(allocation.map(g=>({name:g.brand,amount:g.allocationValue})),totalValue,'브랜드별');
 const allocationHtml=allocation.length?'<div class="brand-analysis-list">'+allocation.map(g=>{
  const share=totalValue?g.allocationValue/totalValue*100:0;
  const sourceNote=g.costFallbackCount?g.valuedCount+'개 평가금액 · '+g.costFallbackCount+'개 구매가 대체':'평가금액 입력 '+g.valuedCount+'개';
  return '<div class="brand-analysis-row"><div class="brand-analysis-main"><div class="brand-analysis-name">'+esc(g.brand)+'</div><div class="brand-analysis-sub">'+share.toFixed(1)+'% · '+sourceNote+'</div><div class="brand-analysis-bar"><span style="width:'+Math.max(0,Math.min(100,share))+'%"></span></div></div><div class="brand-analysis-pnl"><strong>'+formatWon(g.allocationValue)+'</strong></div></div>';
 }).join('')+'</div>':'<div class="brand-analysis-empty">등록된 금액이 있으면 브랜드별 비중을 확인할 수 있어.</div>';
 const comparable=groups.filter(g=>g.comparableCount>0).sort((a,b)=>Math.abs(b.pnl)-Math.abs(a.pnl));
 const maxPnl=Math.max(1,...comparable.map(g=>Math.abs(g.pnl)));
 const pnlHtml=comparable.length?'<div class="brand-analysis-list">'+comparable.map(g=>{
  const pct=g.pnlBase?g.pnl/g.pnlBase*100:0,positive=g.pnl>=0,color=positive?'#16834a':'#d73535';
  return '<div class="brand-analysis-row"><div class="brand-analysis-main"><div class="brand-analysis-name">'+esc(g.brand)+'</div><div class="brand-analysis-sub">'+g.comparableCount+'개 기준 · 원가 '+formatWon(g.pnlBase)+'</div><div class="brand-analysis-bar"><span style="width:'+Math.abs(g.pnl)/maxPnl*100+'%;background:'+color+'"></span></div></div><div class="brand-analysis-pnl"><strong style="color:'+color+'">'+(positive?'+':'−')+formatWon(Math.abs(g.pnl))+'</strong><span class="small" style="color:'+color+'">'+(positive?'+':'')+pct.toFixed(1)+'%</span></div></div>';
 }).join('')+'</div>':'<div class="brand-analysis-empty">현재 평가금액과 구매가가 모두 등록된 시계가 있어야 계산할 수 있어.</div>';
 return '<section class="brand-analysis"><section class="brand-analysis-section"><div class="brand-analysis-heading"><h3>시계별 비중</h3><span class="small">'+watchRows.length+'개 시계</span></div>'+watchDonutHtml+watchListHtml+'<p class="brand-analysis-note">평가금액 우선, 미등록 시 구매금액 기준</p></section><details class="analysis-details"><summary>브랜드별 비중</summary>'+brandDonutHtml+allocationHtml+'<p class="brand-analysis-note">일부 구매금액이 포함된 추정 비중일 수 있어. 합산 '+formatWon(totalValue)+'</p></details><details class="analysis-details"><summary>브랜드별 평가손익</summary>'+pnlHtml+'<p class="brand-analysis-note">평가금액과 구매가가 모두 등록된 시계 기준이며, 수리비·수수료는 제외해.</p></details></section>';
}
function portfolioPage(){
 const held=watches.filter(w=>w.status==='owned'&&w.possession_status!=='sold');
 const sold=watches.filter(w=>w.status==='owned'&&w.possession_status==='sold');
 const repairCost=w=>(Array.isArray(w.repair_history)?w.repair_history:[]).reduce((sum,r)=>sum+Math.max(0,Number(String(r.cost??'').replace(/[^0-9.-]/g,''))||0),0);
 const acquisitionCost=w=>Math.max(0,Number(w.purchase_price)||0)+Math.max(0,Number(w.customs_duty)||0);
 const totalRepairHeld=held.reduce((sum,w)=>sum+repairCost(w),0);
 const totalRepairSold=sold.reduce((sum,w)=>sum+repairCost(w),0);
 const heldAcquisition=held.reduce((sum,w)=>sum+acquisitionCost(w),0);
 const heldOwnership=heldAcquisition+totalRepairHeld;

}

const mainTabScrollPositions={watches:null,timeline:null,portfolio:null,wear:null,photos:null,settings:null};
let activeMainTab='watches';
function mainPageScrollY(){
 const y=window.scrollY;
 return Number.isFinite(y)?y:(document.documentElement.scrollTop||document.body?.scrollTop||0);
}
function restoreMainTabScroll(y){
 const targetY=Math.max(0,Number(y)||0);
 window.scrollTo(0,0);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  window.scrollTo(0,targetY);
  document.documentElement.scrollTop=targetY;
  if(document.body)document.body.scrollTop=targetY;
  requestAnimationFrame(()=>{if(Math.abs(mainPageScrollY()-targetY)>2)window.scrollTo(0,targetY)});
  setTimeout(()=>{if(Math.abs(mainPageScrollY()-targetY)>2)window.scrollTo(0,targetY)},120);
 }));
}
function navigateMainTab(next){
 const allowed=['watches','timeline','portfolio','wear','photos','settings'];
 const target=allowed.includes(next)?next:'watches';
 if(target===activeMainTab)return;
 mainTabScrollPositions[activeMainTab]=mainPageScrollY();
 activeMainTab=target;
 const restoreY=mainTabScrollPositions[target];
 // Render the selected page, then start at the top on first visit or restore its prior position.
 if(target==='watches')renderHome();
 else if(target==='timeline')timelinePage();
 else if(target==='portfolio')portfolioPage();
 else if(target==='wear')wearPage();
 else if(target==='photos')photosPage();
 else settings();
 restoreMainTabScroll(restoreY===null?0:restoreY);
}

function renderMaintenanceSummary(w){const rs=Array.isArray(w.repair_history)?w.repair_history:[];const total=rs.reduce((sum,r)=>sum+(Number(r.cost)||0),0);const latestRepair=[...rs].filter(r=>r.date).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];const hasOverhaul=!!w.overhaul_date;const hasRepair=rs.length>0;const latestMaintenance=hasOverhaul&&latestRepair?.date?(w.overhaul_date>latestRepair.date?w.overhaul_date:latestRepair.date):(w.overhaul_date||latestRepair?.date||'');if(!hasOverhaul&&!hasRepair)return '';const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}):'미등록';return '<section class="maintenance-summary"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><div><div class="eyebrow">MAINTENANCE</div><h2 style="margin:5px 0 0;font-size:18px">정비 요약</h2></div><span class="small">'+(latestMaintenance?'최근 관리 · '+fmtDate(latestMaintenance):'기록 있음')+'</span></div><div class="maintenance-grid">'+(hasOverhaul?'<div class="maintenance-stat"><div class="maintenance-stat-label">최근 오버홀</div><div class="maintenance-stat-value">'+fmtDate(w.overhaul_date)+'</div></div>':'')+(hasRepair?'<div class="maintenance-stat"><div class="maintenance-stat-label">수리 횟수</div><div class="maintenance-stat-value">'+rs.length+'회</div></div>':'')+(hasRepair?'<div class="maintenance-stat"><div class="maintenance-stat-label">누적 수리 비용</div><div class="maintenance-stat-value">'+total.toLocaleString('ko-KR')+'원</div></div>':'')+'</div>'+(latestRepair?.date?'<div class="maintenance-sub">최근 수리 · '+fmtDate(latestRepair.date)+(latestRepair.note?' · '+esc(latestRepair.note):'')+'</div>':'')+'</section>'}
function renderRepairDetails(w){const rs=Array.isArray(w.repair_history)?w.repair_history:[];if(!rs.length)return '';const total=rs.reduce((sum,r)=>sum+(Number(r.cost)||0),0);return `<section style="margin:22px 0 28px;padding:18px 20px;border:1px solid var(--line);background:var(--card);border-radius:14px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><h2 style="margin:0;font-size:16px">수리 이력</h2><strong>${rs.length}회</strong></div><div style="display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)"><span style="color:var(--muted)">누적 수리 비용</span><strong>${total.toLocaleString('ko-KR')}원</strong></div>${[...rs].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><strong>${r.date?fmt(r.date):'날짜 미등록'}</strong><strong>${Number(r.cost)>0?Number(r.cost).toLocaleString('ko-KR')+'원':'비용 미등록'}</strong></div>${r.note?`<div class="small" style="margin-top:5px">${esc(r.note)}</div>`:''}</div>`).join('')}</section>`}

async function saveWatchHistory(watchId){

n><strong style="color:${color};font-size:18px">${rate>0?'+':''}${rate.toFixed(2)}%</strong></div>`:''}</section>`})():''}${w.status==='owned'?(renderMaintenanceSummary(w)+renderRepairDetails(w)+`<section id="watchHistorySection" class="maintenance-summary"><div class="eyebrow">WATCH HISTORY</div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:5px"><h2 style="margin:0;font-size:18px">시계 기록</h2><button class="action" type="button" onclick="openWatchHistory('${w.id}')">+ 기록 추가</button></div><div class="small" style="margin-top:12px">기록을 불러오는 중…</div></section>`):''}${w.note?`<div class="head"><h2>My Note</h2></div><div class="note">${esc(w.note)}</div>`:''}${w.photos?.some(p=>p.note)?`<div class="head"><h2>Photo Notes</h2></div>${w.photos.filter(p=>p.note).map(p=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--line)">${photoTypeLabel(p.type)} · ${esc(p.note)}</div>`).join('')}`:''}${w.tags?.length?`<div class="pills" style="margin:16px 0">${w.tags.map(t=>`<span class="pill">#${esc(t)}</span>`).join('')}</div>`:''}<div class="head"><h2>Photos</h2><span class="small">${w.photos.length}</span></div><div class="detailphotos">${w.photos.map((p,i)=>`<button type="button" onclick="openLightbox('${w.id}',${i})"><img ${photoAttrs(p)} alt="Watch photo"><span style="position:absolute;left:5px;bottom:5px;background:#111b;color:#fff;padding:3px 5px;font-size:8px">${photoTypeLabel(p.type)}</span></button>`).join('')}</div><div class="actions"><button onclick="openEditor(watches.find(x=>x.id==='${w.id}'))">Edit</button><button onclick="favorite('${w.id}')">${w.favorite?'♥ Favorite':'♡ Favorite'}</button><button onclick="delWatch('${w.id}')" class="delete">Delete</button></div><div class="watchNav"><button onclick="openDetail('${prev.id}')">← Previous</button><button onclick="openDetail('${next.id}')">Next →</button></div></div></main>`;

// Keep an unfinished editor draft across app switching, Safari reloads, and accidental page reloads.
const WATCH_DRAFT_DB='watchArchiveDrafts',WATCH_DRAFT_STORE='drafts';
let editorDraftFields=null,draftSaveTimer=null;
function draftDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(WATCH_DRAFT_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(WATCH_DRAFT_STORE))req.result.createObjectStore(WATCH_DRAFT_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function writeDraft(value){try{const db=await draftDb();await new Promise((resolve,reject)=>{const tx=db.transaction(WATCH_DRAFT_STORE,'readwrite');tx.objectStore(WATCH_DRAFT_STORE).put(value,String(currentUser?.id||'guest'));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('Draft autosave failed',e)}}
async function readDraft(){try{const db=await draftDb();const value=await new Promise((resolve,reject)=>{const tx=db.transaction(WATCH_DRAFT_STORE,'readonly');const req=tx.objectStore(WATCH_DRAFT_STORE).get(String(currentUser?.id||'guest'));req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});db.close();return value}catch(e){return null}}
async function clearDraft(){clearTimeout(draftSaveTimer);try{const db=await draftDb();await new Promise((resolve,reject)=>{const tx=db.transaction(WATCH_DRAFT_STORE,'readwrite');tx.objectStore(WATCH_DRAFT_STORE).delete(String(currentUser?.id||'guest'));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){}editorDraftFields=null}
function captureEditorDraft(){if(!document.querySelector('.overlay'))return null;const val=id=>document.getElementById(id)?.value??'';return{editing,editStatus,fields:{brand:val('brand'),model:val('model'),reference:val('reference'),size:val('size'),movement:val('movement'),purchasePrice:val('purchasePrice'),purchaseSource:val('purchaseSource'),customsDuty:val('customsDuty'),salePrice:val('salePrice'),saleDate:val('saleDate'),saleReason:val('saleReason'),possessionStatus:val('possessionStatus')||(editorDraftFields?.possessionStatus||'held'),purchaseDate:val('purchaseDate'),overhaulDate:val('overhaulDate'),purchaseReason:val('purchaseReason'),tags:val('tags'),note:val('note'),repairHistory:JSON.parse(JSON.stringify(editorRepairs))},photos:editPhotos.map(p=>({id:p.id,src:p.newPhoto?p.src:'',path:p.path||'',cover:!!p.cover,sortOrder:p.sortOrder,type:p.type||'watch',note:p.note||'',newPhoto:!!p.newPhoto}))}}
function scheduleDraftSave(){clearTimeout(draftSaveTimer);draftSaveTimer=setTimeout(()=>{const d=captureEditorDraft();if(d)writeDraft(d)},180)}
async function restoreEditorDraft(){const d=await readDraft();if(!d||!currentUser)return;if(d.editing&&!watches.some(w=>w.id===d.editing)){await clearDraft();return}editing=d.editing||null;editStatus=d.editStatus||'archive';editorDraftFields=d.fields||{};editorRepairs=JSON.parse(JSON.stringify(editorDraftFields.repairHistory||[]));editPhotos=(d.photos||[]).map(p=>{const existing=watches.flatMap(w=>w.photos||[]).find(x=>x.id===p.id||p.path&&x.path===p.path);return{...p,src:p.newPhoto?p.src:(existing?.src||''),file:null}});renderEditor();toast('작성 중이던 내용을 복원했어요')}
document.addEventListener('input',e=>{if(e.target.closest('.overlay'))scheduleDraftSave()});
document.addEventListener('change',e=>{if(e.target.closest('.overlay'))scheduleDraftSave()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){const d=captureEditorDraft();if(d)writeDraft(d)}});
window.addEventListener('pagehide',()=>{const d=captureEditorDraft();if(d)writeDraft(d)});

let editorRepairs=[];
function openEditor(w=null){editorDraftFields=null;editorRepairs=JSON.parse(JSON.stringify(w?.repair_history||[]));editing=w?.id||null;editPhotos=w?JSON.parse(JSON.stringify(w.photos||[])):[];editStatus=w?.status||filter;renderEditor();scheduleDraftSave()}
function renderRepairEditor(){return editorRepairs.map((r,i)=>`<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong style="font-size:13px">수리 ${i+1}</strong><button type="button" class="action" style="padding:6px 9px;font-size:12px" onclick="removeRepair(${i})">삭제</button></div><div class="formgrid"><div class="field"><label>수리 날짜</label><input type="date" value="${esc(r.date||'')}" onchange="updateRepair(${i},'date',this.value)"></div><div class="field"><label>수리 비용 (원)</label><input type="text" inputmode="numeric" value="${esc(r.cost?Number(r.cost).toLocaleString('ko-KR'):'')}" placeholder="150,000" oninput="formatRepairCostInput(this,${i})"></div><div class="field full"><label>수리 내용 (선택)</label><input value="${esc(r.note||'')}" placeholder="예: 용두 교체, 폴리싱" oninput="updateRepair(${i},'note',this.value)"></div></div></div>`).join('')||'<div class="small" style="padding:8px 0">등록된 수리 이력이 없어.</div>'}
function addRepair(){editorRepairs.push({id:uid(),date:'',cost:'',note:''});editorDraftFields=captureEditorDraft()?.fields||editorDraftFields;renderEditor();scheduleDraftSave()}
function removeRepair(i){editorRepairs.splice(i,1);editorDraftFields=captureEditorDraft()?.fields||editorDraftFields;renderEditor();scheduleDraftSave()}
function formatRepairCostInput(el,index){if(!el||!editorRepairs[index])return;const digits=String(el.value||'').replace(/[^0-9]/g,'');editorRepairs[index].cost=digits;el.value=digits?Number(digits).toLocaleString('ko-KR'):'';scheduleDraftSave()}
function updateRepair(i,key,value){if(!editorRepairs[i])return;editorRepairs[i][key]=key==='cost'?String(value||'').replace(/[^0-9]/g,''):value;scheduleDraftSave()}

function timelinePage(){
  const owned=watches.filter(w=>w.status==='owned');
  const validDate=d=>d&&/^\d{4}-\d{2}-\d{2}$/.test(d);
  const sortKey='watchArchiveTimelineSort_v1';
  let sortOrder=localStorage.getItem(sortKey)==='oldest'?'oldest':'newest';
  const fmt=d=>{const p=d.split('-');return p[0]+'. '+Number(p[1])+'. '+Number(p[2])+'.'};
  const item=(w,dateKey,label)=>{const p=w.photos?.find(x=>x.cover)||w.photos?.[0];return '<div class="timeline-item"><div class="timeline-date">'+(w[dateKey]?fmt(w[dateKey]):'날짜 미등록')+'<div class="small" style="margin-top:3px">'+label+'</div></div><button type="button" class="timeline-card" onclick="openTimelineDetail(\''+w.id+'\')">'+(p?'<img class="timeline-photo" '+photoAttrs(p)+' alt="'+esc(w.brand+' '+w.model)+'">':'<div class="timeline-photo" style="display:grid;place-items:center">⌚</div>')+'<div style="min-width:0"><div class="timeline-brand">'+esc(w.brand||'')+'</div><div class="timeline-model">'+esc(w.model||'Untitled')+'</div>'+(w.reference?'<div class="timeline-ref">Ref. '+esc(w.reference)+'</div>':'')+'</div></button></div>'};
  const makeEvents=()=>{
    const events=[];
    owned.forEach(w=>{
      if(validDate(w.purchase_date))events.push({watch:w,date:w.purchase_date,type:'purchase',price:Number(w.purchase_price)||0});
      if(w.possession_status==='sold'&&validDate(w.sale_date))events.push({watch:w,date:w.sale_date,type:'sale',price:Number(w.sale_price)||0});
    });
    const name=e=>(e.watch.brand||'')+' '+(e.watch.model||'');
    events.sort((a,b)=>{
      const dateCmp=a.date.localeCompare(b.date);
      if(dateCmp)return sortOrder==='newest'?-dateCmp:dateCmp;
      const typeCmp=a.type===b.type?0:(a.type==='purchase'?-1:1);
      return typeCmp||name(a).localeCompare(name(b));
    });
    return events;
  };
  const undatedPurchases=owned.filter(w=>!validDate(w.purchase_date)).sort((a,b)=>(a.brand+' '+a.model).localeCompare(b.brand+' '+b.model));
  const undatedSales=owned.filter(w=>w.possession_status==='sold'&&!validDate(w.sale_date)).sort((a,b)=>(a.brand+' '+a.model).localeCompare(b.brand+' '+b.model));
  const render=()=>{
    const events=makeEvents(),years=[...new Set(events.map(e=>e.date.slice(0,4)))];
    let html='<main class="app"><div class="top"><div><div class="eyebrow">COLLECTION HISTORY</div><div class="brand">시계생활 타임라인</div></div></div><p class="small" style="line-height:1.7">시계를 구매하고 판매한 기록을 날짜순으로 한곳에 모았어. 구매액과 판매액은 별도로 집계돼.</p><div class="timeline-toolbar"><div><div class="timeline-filter-label">정렬 순서</div><div class="small">구매일·판매일 기준</div></div><div class="timeline-sort-control" role="group" aria-label="타임라인 정렬"><button type="button" class="'+(sortOrder==='newest'?'active':'')+'" data-timeline-sort="newest" aria-pressed="'+(sortOrder==='newest')+'">최신순 ↓</button><button type="button" class="'+(sortOrder==='oldest'?'active':'')+'" data-timeline-sort="oldest" aria-pressed="'+(sortOrder==='oldest')+'">과거순 ↑</button></div></div><div class="head"><h2>시계생활 타임라인</h2><span class="small">'+events.length+'건</span></div>';
    if(events.length){
      years.forEach(y=>{
        const yearEvents=events.filter(e=>e.date.startsWith(y));
        const buys=yearEvents.filter(e=>e.type==='purchase'),sales=yearEvents.filter(e=>e.type==='sale');
        const buyTotal=buys.reduce((sum,e)=>sum+e.price,0),saleTotal=sales.reduce((sum,e)=>sum+e.price,0);
        const buyKnown=buys.filter(e=>e.price>0).length,saleKnown=sales.filter(e=>e.price>0).length;
        html+='<section class="timeline-year-group"><div class="timeline-year" style="margin-top:0">'+y+'</div><div class="timeline-year-total" style="display:flex;flex-direction:column;align-items:stretch;gap:7px"><div style="display:flex;justify-content:space-between;gap:12px"><span>구매 총액</span><strong>'+(buyKnown?buyTotal.toLocaleString('ko-KR')+'원':'금액 미등록')+'</strong></div><span class="timeline-year-count">'+buys.length+'건'+(buyKnown<buys.length?' · 금액 '+buyKnown+'건 등록':'')+'</span>'+(sales.length?'<div style="display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:7px"><span>판매 총액</span><strong>'+(saleKnown?saleTotal.toLocaleString('ko-KR')+'원':'금액 미등록')+'</strong></div><span class="timeline-year-count">'+sales.length+'건'+(saleKnown<sales.length?' · 금액 '+saleKnown+'건 등록':'')+'</span>':'')+'</div><div class="timeline-list">'+yearEvents.map(e=>item(e.watch,e.type==='sale'?'sale_date':'purchase_date',e.type==='sale'?'판매':'구매')).join('')+'</div></section>';
      });
    }else html+='<div class="empty">구매일 또는 판매일을 입력하면 타임라인에 표시돼.</div>';
    if(undatedPurchases.length)html+='<div class="timeline-undated"><div class="head"><h2>구매일 미등록</h2><span class="small">'+undatedPurchases.length+'개</span></div><div class="timeline-list">'+undatedPurchases.map(w=>item(w,'purchase_date','구매')).join('')+'</div></div>';
    if(undatedSales.length)html+='<div class="timeline-undated"><div class="head"><h2>판매일 미등록</h2><span class="small">'+undatedSales.length+'개</span></div><div class="timeline-list">'+undatedSales.map(w=>item(w,'sale_date','판매')).join('')+'</div></div>';
    if(!owned.length)html+='<div class="empty">등록된 시계가 없어.</div>';
    $('#app').innerHTML=html+'</main>'+nav('timeline');
    document.querySelectorAll('[data-timeline-sort]').forEach(button=>button.addEventListener('click',()=>{
      const next=button.getAttribute('data-timeline-sort');
      if(next===sortOrder)return;
      sortOrder=next;localStorage.setItem(sortKey,sortOrder);render();
    }));
    activateLazyImages(document);
  };
  render();
}

function downloadArchiveFile(filename,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function archiveDateStamp(){return new Date().toISOString().slice(0,10)}

function archiveBlobToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||new Error('파일 읽기 실패'));reader.readAsDataURL(blob)})}

const ARCHIVE_BACKUP_STATE_KEY='watchArchiveBackupProgress_v1';
let archiveBackupTimer=null;
function getArchiveBackupState(){try{return JSON.parse(localStorage.getItem(ARCHIVE_BACKUP_STATE_KEY)||'null')}catch(e){return null}}
function saveArchiveBackupState(state){localStorage.setItem(ARCHIVE_BACKUP_STATE_KEY,JSON.stringify({...state,updatedAt:Date.now()}));renderArchiveBackupProgress()}
function formatBackupElapsed(ms){const sec=Math.max(0,Math.floor(ms/1000));return sec<60?sec+'초':Math.floor(sec/60)+'분 '+String(sec%60).padStart(2,'0')+'초'}
function renderArchiveBackupProgress(){
 const el=document.getElementById('archiveBackupProgress');if(!el)return;
 let state=getArchiveBackupState();
 if(!state){el.innerHTML='<div class="small">아직 백업을 실행하지 않았어요.</div>';return}
 if(state.status==='running'&&!window.__archiveBackupRunning){state={...state,status:'interrupted',message:'백업이 중단됐거나 앱이 종료됐어요. 새 백업을 다시 실행해 주세요.',updatedAt:Date.now()};localStorage.setItem(ARCHIVE_BACKUP_STATE_KEY,JSON.stringify(state))}
 const running=state.status==='running',done=state.status==='complete',failed=state.status==='error',pct=Math.max(0,Math.min(100,Number(state.percent)||0));
 const elapsed=state.startedAt?formatBackupElapsed((done||failed||state.status==='interrupted'?(state.finishedAt||state.updatedAt):Date.now())-state.startedAt):'—';
 const eta=running&&state.totalPhotos>=3&&(state.donePhotos||0)>=2?formatBackupElapsed(((Date.now()-state.startedAt)/(state.donePhotos||1))*(state.totalPhotos-state.donePhotos)):'';
 el.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px"><strong>'+({running:'백업 진행 중',complete:'백업 파일 생성 완료',error:'백업 실패',interrupted:'백업 중단',idle:'백업 상태'}[state.status]||'백업 상태')+'</strong><strong style="font-variant-numeric:tabular-nums">'+pct+'%</strong></div><div role="progressbar" aria-label="백업 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" style="height:8px;border-radius:99px;background:var(--soft);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--ink);border-radius:99px;transition:width .2s ease"></div></div><div style="display:flex;justify-content:space-between;gap:12px;margin-top:9px"><span class="small">'+esc(state.message||'상태 확인 중')+'</span><span class="small" style="white-space:nowrap">경과 '+elapsed+'</span></div>'+(state.totalPhotos>0?'<div class="small" style="margin-top:5px">사진 '+(state.donePhotos||0)+' / '+state.totalPhotos+'개 처리'+(eta?' · 예상 남은 시간 약 '+eta:'')+'</div>':'')+(state.status==='interrupted'?'<div class="small" style="margin-top:8px">백업 파일이 생성됐는지 확인할 수 없어요. 파일이 없으면 다시 백업해 주세요.</div>':'');
}
function setArchiveBackupProgress(patch){const previous=getArchiveBackupState()||{};saveArchiveBackupState({...previous,...patch})}
function startArchiveBackupTimer(){if(archiveBackupTimer)clearInterval(archiveBackupTimer);archiveBackupTimer=setInterval(()=>{const state=getArchiveBackupState();if(state?.status!=='running'){clearInterval(archiveBackupTimer);archiveBackupTimer=null;return}renderArchiveBackupProgress()},1000)}
async function exportFullBackup(){
 if(!currentUser)return toast('로그인 후 이용해줘');
 if(window.__archiveBackupRunning)return toast('백업이 이미 진행 중이에요');
 window.__archiveBackupRunning=true;
 const startedAt=Date.now(),button=document.getElementById('archiveBackupButton');
 if(button){button.disabled=true;button.textContent='백업 진행 중…'}
 setArchiveBackupProgress({status:'running',percent:2,message:'데이터 목록을 불러오는 중…',startedAt,finishedAt:null,donePhotos:0,totalPhotos:0});
 startArchiveBackupTimer();
 try{
  const [watchRows,photoRows,wearRows,brandRows,historyRows]=await Promise.all([archiveRows('watches'),archiveRows('watch_photos'),archiveRows('wear_logs'),archiveRows('brands'),archiveRows('watch_history')]);
  const photoPaths=[...new Set(photoRows.map(p=>p.storage_path).filter(Boolean))],photoFiles={};
  setArchiveBackupProgress({percent:10,message:'시계와 기록을 불러왔어요. 사진 목록을 확인 중…',totalPhotos:photoPaths.length,donePhotos:0});
  if(photoPaths.length){

   if(error)throw new Error('사진 URL 생성 실패: '+error.message);
   setArchiveBackupProgress({percent:15,message:'사진 원본을 다운로드하는 중…'});
   for(let i=0;i<photoPaths.length;i++){
    const url=signed?.[i]?.signedUrl;if(!url)throw new Error('사진 백업 URL 생성 실패. 누락 방지를 위해 백업을 중단했어요.');
    const response=await fetch(url);if(!response.ok)throw new Error('사진 다운로드 실패 ('+(i+1)+'/'+photoPaths.length+')');
    const blob=await response.blob();photoFiles[photoPaths[i]]={data:await archiveBlobToDataUrl(blob),contentType:blob.type||'image/jpeg'};
    setArchiveBackupProgress({percent:15+Math.round((i+1)/photoPaths.length*70),message:'사진 원본을 처리하는 중…',donePhotos:i+1,totalPhotos:photoPaths.length});
   }
  }else setArchiveBackupProgress({percent:85,message:'사진이 없어 기록 데이터를 정리 중…',donePhotos:0,totalPhotos:0});
  setArchiveBackupProgress({percent:88,message:'백업 JSON 파일을 구성하는 중…'});
  const backup={format:'watch-archive-backup',schemaVersion:1,createdAt:new Date().toISOString(),accountEmail:currentUser.email||null,data:{watches:watchRows,watch_photos:photoRows,wear_logs:wearRows,brands:brandRows,watch_history:historyRows,photoFiles,local:{brands:localStorage.getItem(BRANDS_KEY),budget:localStorage.getItem(BUDGET_KEY),showVersion:localStorage.getItem(VERSION_VISIBLE_KEY)}}};
  setArchiveBackupProgress({percent:95,message:'백업 파일을 생성하고 있어요…'});
  downloadArchiveFile('watch-archive-backup-'+archiveDateStamp()+'.json',JSON.stringify(backup),'application/json;charset=utf-8');

 }

function validateBackupObject(backup){
 const errors=[],warnings=[],d=backup?.data;
 if(!backup||backup.format!=='watch-archive-backup')errors.push('Watch Archive 백업 파일 형식이 아닙니다.');
 if(!d||typeof d!=='object'){errors.push('data 항목이 없거나 올바르지 않습니다.');return {valid:false,errors,warnings,summary:null}}
 for(const key of ['watches','watch_photos','wear_logs','brands','watch_history'])if(!Array.isArray(d[key]))errors.push(key+' 목록이 배열 형식이 아닙니다.');
 if(!d.photoFiles||typeof d.photoFiles!=='object'||Array.isArray(d.photoFiles))errors.push('사진 파일 목록(photoFiles)이 없습니다.');
 if(!Array.isArray(d.watches)||!Array.isArray(d.watch_photos)||!d.photoFiles||typeof d.photoFiles!=='object')return {valid:false,errors,warnings,summary:null};
 const watchIds=new Set(),photoIds=new Set(),paths=new Set();
 for(const [i,w] of d.watches.entries()){
  if(!w||!w.id)errors.push('시계 '+(i+1)+'번째 항목에 ID가 없습니다.');
  else if(watchIds.has(String(w.id)))errors.push('중복된 시계 ID가 있습니다: '+w.id);else watchIds.add(String(w.id));
 }
 let missingPhotoData=0,invalidPhotoData=0,orphanPhotos=0;
 for(const [i,p] of d.watch_photos.entries()){
  if(!p||!p.id){errors.push('사진 메타데이터 '+(i+1)+'번째 항목에 ID가 없습니다.');continue}
  if(photoIds.has(String(p.id)))errors.push('중복된 사진 ID가 있습니다: '+p.id);else photoIds.add(String(p.id));
  if(!p.storage_path){errors.push('사진 '+p.id+'에 저장 경로가 없습니다.');continue}
  if(paths.has(p.storage_path))errors.push('중복된 사진 경로가 있습니다: '+p.storage_path);else paths.add(p.storage_path);
  if(p.watch_id&&!watchIds.has(String(p.watch_id)))orphanPhotos++;
  const f=d.photoFiles[p.storage_path];
  if(!f||typeof f.data!=='string'){missingPhotoData++;continue}
  if(!/^data:image\/[a-zA-Z0-9.+-]+;base64,/.test(f.data)){invalidPhotoData++;continue}
  const comma=f.data.indexOf(','),payload=comma>=0?f.data.slice(comma+1):'';
  if(!payload.length||payload.length%4!==0||!/^[A-Za-z0-9+/]*={0,2}$/.test(payload))invalidPhotoData++;
 }
 const extraPhotoFiles=Object.keys(d.photoFiles).filter(path=>!paths.has(path)).length;
 if(missingPhotoData)errors.push('사진 원본 누락: '+missingPhotoData+'개');
 if(invalidPhotoData)errors.push('사진 데이터 형식 오류: '+invalidPhotoData+'개');
 if(orphanPhotos)warnings.push('연결된 시계 항목을 찾지 못한 사진: '+orphanPhotos+'개');
 if(extraPhotoFiles)warnings.push('사진 메타데이터와 연결되지 않은 원본 파일: '+extraPhotoFiles+'개');
 const collections=['wear_logs','brands','watch_history'];
 for(const key of collections)if(Array.isArray(d[key])){const seen=new Set();for(const row of d[key]){if(row?.id&&seen.has(String(row.id))){warnings.push(key+'에 중복 ID가 있습니다.');break}if(row?.id)seen.add(String(row.id))}}
 if(!backup.createdAt)warnings.push('백업 생성 시각이 기록되어 있지 않습니다.');
 if(!d.local||typeof d.local!=='object')warnings.push('로컬 설정 정보가 없습니다.');
 return {valid:errors.length===0,errors,warnings,summary:{watches:d.watches.length,photos:d.watch_photos.length,photoFiles:Object.keys(d.photoFiles).length,wearLogs:Array.isArray(d.wear_logs)?d.wear_logs.length:0,brands:Array.isArray(d.brands)?d.brands.length:0,history:Array.isArray(d.watch_history)?d.watch_history.length:0,createdAt:backup.createdAt||null}}
}
function renderBackupValidation(result,fileName,fileSize){
 const el=document.getElementById('archiveValidationResult');if(!el)return;
 if(!result){el.innerHTML='<div class="small">백업 파일을 선택하면 JSON 구조와 사진 데이터 누락 여부를 검사해요.</div>';return}
 const ok=result.valid;
 const size=(fileSize/1024/1024).toFixed(1)+'MB';
 let html='<div style="padding:12px;border:1px solid var(--line);border-radius:8px;margin-top:12px"><strong>'+(ok?'검증 통과':'검증 실패')+'</strong><div class="small" style="margin-top:5px">'+esc(fileName||'백업 파일')+' · '+size+'</div>';
 if(result.summary){const q=result.summary;html+='<div class="small" style="line-height:1.8;margin-top:8px">시계 '+q.watches+'개 · 사진 '+q.photos+'개 · 사진 원본 '+q.photoFiles+'개<br>착용 기록 '+q.wearLogs+'개 · 브랜드 '+q.brands+'개 · 시계 이력 '+q.history+'개'+(q.createdAt?'<br>백업 생성: '+esc(new Date(q.createdAt).toLocaleString('ko-KR')):'')+'</div>'}
 if(result.errors.length)html+='<div style="margin-top:10px;color:var(--danger,#b42318)"><strong>문제</strong><ul style="padding-left:20px;margin:5px 0">'+result.errors.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
 if(result.warnings.length)html+='<div style="margin-top:10px"><strong>확인 사항</strong><ul style="padding-left:20px;margin:5px 0">'+result.warnings.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
 html+='<div class="small" style="margin-top:8px">'+(ok?'기본 구조와 사진 데이터 형식을 확인했어요. 실제 복원까지 보장하는 검사는 아니에요.':'문제를 해결하거나 정상 백업 파일을 다시 만든 뒤 복원해 주세요.')+'</div></div>';
 el.innerHTML=html;
}
async function validateBackupFile(input){
 const file=input.files?.[0];input.value='';if(!file)return;
 const el=document.getElementById('archiveValidationResult');if(el)el.innerHTML='<div class="small">파일 읽기 및 사진 데이터 검사 중… 용량에 따라 시간이 걸릴 수 있어요.</div>';
 const button=document.getElementById('archiveValidateButton');if(button){button.disabled=true;button.textContent='검증 중…'}
 try{
  const text=await file.text();let backup;
  try{backup=JSON.parse(text)}catch(e){const result={valid:false,errors:['JSON 파싱 실패: 파일이 잘렸거나 올바른 JSON 형식이 아닙니다.'],warnings:[],summary:null};renderBackupValidation(result,file.name,file.size);return}
  const result=validateBackupObject(backup);renderBackupValidation(result,file.name,file.size);
  if(result.valid)toast('백업 파일 검증 통과');else toast('백업 파일에서 확인이 필요한 문제가 발견됐어요');
 }catch(e){console.error('Backup validation failed',e);renderBackupValidation({valid:false,errors:['파일 검사 중 오류: '+(e?.message||String(e))],warnings:[],summary:null},file.name,file.size)}
 finally{if(button){button.disabled=false;button.textContent='백업 파일 검증하기'}}
}

async function restoreFullBackup(input){
 const file=input.files?.[0];input.value='';if(!file)return;if(!currentUser)return toast('로그인 후 이용해줘');
 let backup;try{backup=JSON.parse(await file.text())}catch(e){return alert('백업 파일을 읽을 수 없어요. 올바른 JSON인지 확인해줘.')}
 const validation=validateBackupObject(backup);renderBackupValidation(validation,file.name,file.size);if(!validation.valid)return alert('백업 파일 검증에 실패했어요.\n\n'+validation.errors.join('\n'));if(validation.warnings.length&&!confirm('백업 파일에 확인할 사항이 있어요.\n\n'+validation.warnings.join('\n')+'\n\n계속 복원할까요?'))return;
 const d=backup.data,watchCount=d.watches.length,photoCount=d.watch_photos.length;
 if(!confirm('백업을 복원할까요?\n\n시계 '+watchCount+'개 · 사진 '+photoCount+'개\n\n같은 ID의 항목은 백업 내용으로 갱신되고, 백업에만 없는 기존 항목은 삭제하지 않아요. 복원 전 현재 상태도 백업하는 것을 권장해요.'))return;
 const button=document.getElementById('archiveRestoreButton');if(button){button.disabled=true;button.textContent='복원 중…'}
 try{
  const watchesToRestore=d.watches.map(row=>({...row,user_id:currentUser.id}));
  if(watchesToRestore.length){const {error}=await supabaseClient.from('watches').upsert(watchesToRestore,{onConflict:'id'});if(error)throw new Error('시계 복원 실패: '+error.message)}
  let restoredPhotos=0;
  for(const photo of d.watch_photos){
   const embedded=d.photoFiles?.[photo.storage_path];if(!embedded?.data)throw new Error('백업에 사진 파일이 없습니다: '+photo.storage_path);
   const blob=await(await fetch(embedded.data)).blob(),ext=(photo.storage_path.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').slice(0,8)||'jpg';
   const path=currentUser.id+'/'+photo.watch_id+'/'+photo.id+'.'+ext;
   const {error:uploadError}=await supabaseClient.storage.from('watch-photos').upload(path,blob,{contentType:embedded.contentType||blob.type||'image/jpeg',cacheControl:'3600',upsert:true});if(uploadError)throw new Error('사진 업로드 실패: '+uploadError.message);
   const {error:metaError}=await supabaseClient.from('watch_photos').upsert({...photo,user_id:currentUser.id,storage_path:path},{onConflict:'id'});if(metaError)throw new Error('사진 정보 복원 실패: '+metaError.message);restoredPhotos++;
  }
  if(Array.isArray(d.wear_logs)&&d.wear_logs.length){const {error}=await supabaseClient.from('wear_logs').upsert(d.wear_logs.map(x=>({...x,user_id:currentUser.id})),{onConflict:'user_id,wear_date'});if(error)throw new Error('착용 기록 복원 실패: '+error.message)}
  if(Array.isArray(d.watch_history)&&d.watch_history.length){const {error}=await supabaseClient.from('watch_history').upsert(d.watch_history.map(x=>({...x,user_id:currentUser.id})),{onConflict:'id'});if(error)throw new Error('시계 이력 복원 실패: '+error.message)}
  if(Array.isArray(d.brands)){for(const b of d.brands){if(!b.name)continue;const {data:existing,error:findError}=await supabaseClient.from('brands').select('id').eq('user_id',currentUser.id).eq('name',b.name).limit(1);if(findError)throw new Error('브랜드 확인 실패: '+findError.message);if(!existing?.length){const {error}=await supabaseClient.from('brands').insert({...b,user_id:currentUser.id});if(error)throw new Error('브랜드 복원 실패: '+error.message)}}}
  if(d.local?.brands!=null)localStorage.setItem(BRANDS_KEY,d.local.brands);if(d.local?.budget!=null)localStorage.setItem(BUDGET_KEY,d.local.budget);if(d.local?.showVersion!=null)localStorage.setItem(VERSION_VISIBLE_KEY,d.local.showVersion);
  await loadBrands();await load();toast('복원 완료 · 시계 '+watchCount+'개, 사진 '+restoredPhotos+'개');alert('복원이 완료됐어요.\n시계 '+watchCount+'개\n사진 '+restoredPhotos+'개\n\n백업에 없는 기존 항목은 삭제하지 않았어요.');
 }catch(e){console.error('Archive restore failed',e);alert('복원 도중 오류가 발생했어요.\n'+(e?.message||String(e))+'\n\n일부 데이터가 복원됐을 수 있으니 현재 상태를 확인해줘.')}finally{if(button){button.disabled=false;button.textContent='백업 파일에서 복원하기'}}
}

function urlBase64ToUint8Array(v){const p='='.repeat((4-v.length%4)%4);const b=(v+p).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}

async function setWearReminderPush(enable){
 if(!currentUser)return toast('로그인 후 이용해줘');
 if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){alert('이 브라우저는 푸시 알림을 지원하지 않아요. iPhone에서는 홈 화면에 추가한 Watch Archive를 실행해줘.');return}
 const button=document.getElementById('wearPushToggle');if(button){button.disabled=true;button.textContent='설정 중…'}
 try{
  const registration=await navigator.serviceWorker.register('./sw.js');
  if(enable){
   if(Notification.permission==='denied')throw new Error('브라우저 설정에서 알림이 차단되어 있어요.');
   const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
   if(permission!=='granted')throw new Error('알림 권한을 허용해야 사용할 수 있어요.');
   let subscription=await registration.pushManager.getSubscription();
   if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(WEAR_PUSH_VAPID_PUBLIC_KEY)});
   const j=subscription.toJSON();
   const {error}=await supabaseClient.from('push_subscriptions').upsert({user_id:currentUser.id,endpoint:j.endpoint,p256dh:j.keys?.p256dh,auth:j.keys?.auth,updated_at:new Date().toISOString()},{onConflict:'user_id,endpoint'});
   if(error)throw error;toast('착용 기록 알림을 설정했어요');
  }else{
   const sub=await registration.pushManager.getSubscription();
   if(sub){const endpoint=sub.endpoint;await sub.unsubscribe();const {error}=await supabaseClient.from('push_subscriptions').delete().eq('user_id',currentUser.id).eq('endpoint',endpoint);if(error)throw error}
   toast('착용 기록 알림을 해제했어요');
  }
  settings();
 }catch(e){console.error('Wear reminder push setup failed',e);alert('알림 설정을 완료하지 못했어요. '+(e?.message||String(e)))}
 finally{const b=document.getElementById('wearPushToggle');if(b)b.disabled=false}
}

eRestoreFile\').click()">백업 파일에서 복원하기</button></section><section class="empty" style="text-align:left;margin-bottom:20px"><strong>시계 목록 CSV</strong><p class="small" style="line-height:1.7">시계 정보와 구매·판매 데이터를 엑셀에서 확인할 수 있도록 내보내.</p><button type="button" class="action" style="width:100%;margin-top:8px" onclick="exportWatchesCsv()">CSV 내보내기</button></section><div class="head"><h2>Notifications</h2></div><section class="empty" style="text-align:left;margin-bottom:20px"><strong>Daily Wear Reminder</strong><p class="small" style="line-height:1.7">매일 오전 9시(KST)에 오늘 착용 기록이 없으면 알림을 보내는 기능이에요. iPhone에서는 Watch Archive를 홈 화면에 추가하고 알림을 허용해야 해요.</p><button id="wearPushToggle" type="button" class="action" style="width:100%;margin-top:8px" onclick="setWearReminderPush(this.dataset.enabled !== &quot;true&quot;)">착용 기록 알림 켜기</button><div class="small" style="margin-top:8px">서버의 정기 실행과 푸시 발송 키 설정이 완료되어야 실제 알림이 발송돼요.</div></section><div class="head"><h2>Tools</h2></div><button type="button" class="action" style="width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;margin-bottom:20px" onclick="budgetPage()"><span><strong>Budget</strong><br><span class="small">시계 예산 및 취득금액 관리</span></span><span aria-hidden="true">›</span></button><div class="head"><h2>Display</h2></div><div class="empty" style="text-align:left"><label style="display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer"><span><strong>Version information</strong><br><span class="small">메인 화면에 테스트 버전 표시</span></span><input type="checkbox" '+(showVersion?'checked':'')+' onchange="setVersionVisibility(this.checked)" style="width:22px;height:22px;accent-color:var(--text)"></label><div class="small" style="margin-top:12px">현재 버전: '+APP_VERSION+' · '+APP_BUILD_DATE+'</div></div><div class="head"><h2>Account</h2></div><div class="empty">Supabase Cloud Archive<br><span class="small">'+email+'</span><br><br><button class="action" onclick="signOut()">Sign out</button></div> function updateTheme(){let h=new Date().getHours();let dark=h>=21||h<8;document.documentElement.classList.toggle('dark',dark);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#171614':'#f5f3ee')}
function scheduleTheme(){updateTheme();let now=new Date(),next=new Date(now);next.setMinutes(0,0,0);next.setHours(now.getHours()+1);let ms=next-now;setTimeout(()=>{updateTheme();scheduleTheme()},Math.max(ms,1000))}
scheduleTheme();
