function cover(w){return w.photos?.find(p=>p.cover)?.src||w.photos?.[0]?.src||''}
async function load(){
let{data,error}=await supabaseClient.from('watches').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});
if(error){toast('시계 데이터를 불러오지 못했어요');return}
let rows=data||[];
let{data:photos}=await supabaseClient.from('watch_photos').select('*').eq('user_id',currentUser.id).order('sort_order');
let photoRows=photos||[];
let paths=[...new Set(photoRows.map(p=>p.storage_path).filter(Boolean))];
let signedByPath=new Map();
if(paths.length){
  let{data:signed,error:signedError}=await supabaseClient.storage.from('watch-photos').createSignedUrls(paths,3600);
  if(!signedError)(signed||[]).forEach((s,i)=>{if(s?.signedUrl)signedByPath.set(paths[i],s.signedUrl)});
}
watches=rows.map(w=>{
  let ps=photoRows.filter(p=>p.watch_id===w.id).map(p=>({
    id:p.id,src:signedByPath.get(p.storage_path)||'',path:p.storage_path,cover:p.is_cover,
    sortOrder:p.sort_order,type:p.photo_type||'watch',note:p.note||''
  }));
  return{id:w.id,status:w.status,brand:w.brand,model:w.model,reference:w.reference||'',size:w.size||'',movement:w.movement||'',tags:w.tags||[],note:w.note||'',photos:ps,favorite:w.favorite,createdAt:w.created_at,updatedAt:w.updated_at};
});
renderHome();
}
function nav(){return`<nav class="navbar"><div class="navin"><button class="nav active" onclick="renderHome()"><span>⌚</span>Watches</button><button class="nav" onclick="photosPage()"><span>▧</span>Photos</button><button class="nav" onclick="settings()"><span>⋯</span>Settings</button></div></nav>`}
function dailyInspiration(){let pool=watches.flatMap(w=>(w.status==='archive'?(w.photos||[]).filter(p=>p?.src).map((p,i)=>({w,p,i})):[]));if(!pool.length)return "";let today=new Date();let key=`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;let hash=0;for(let i=0;i<key.length;i++)hash=(hash*31+key.charCodeAt(i))>>>0;let item=pool[hash%pool.length],ps=orderedPhotos(item.w),idx=ps.findIndex(p=>p.id===item.p.id);if(idx<0)idx=0;let day=today.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});return`<section class="inspiration"><div class="inspirationhead"><span class="inspirationeyebrow">DAILY INSPIRATION</span><span class="inspirationdate">${day}</span></div><img class="inspirationimg" src="${item.p.src}" alt="${esc(item.w.brand||'')} ${esc(item.w.model||'Watch')}" onclick="event.stopPropagation();openLightbox('${esc(item.w.id)}',${idx})"><div class="inspirationmeta" onclick="openLightbox('${esc(item.w.id)}',${idx})"><div class="inspirationbrand">${esc(item.w.brand||'BRAND')}</div><div class="inspirationmodel">${esc(item.w.model||'Untitled')}</div><div class="inspirationhint">Archive · 사진을 눌러 크게 보기</div></div></section>`}
function getBrandCounts(){let counts={};watches.filter(w=>w.status===filter).forEach(w=>{let b=String(w.brand||'').trim();if(b)counts[b]=(counts[b]||0)+1});return Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0]));}
function brandFilterHtml(){let items=getBrandCounts(),selected=brandFilter?items.find(([b])=>b.trim().toLowerCase()===brandFilter.trim().toLowerCase()):null;let selectedBrand=selected?selected[0]:'';if(selectedBrand&&selectedBrand!==brandFilter)brandFilter=selectedBrand;let label=selected?selected[0]+' ('+selected[1]+')':'All Brands';return '<div class="brandFilter" id="brandFilter"><div class="brandFilterLabel">BRAND</div><button type="button" class="brandFilterButton" onclick="toggleBrandMenu(event)" aria-haspopup="listbox" aria-expanded="false"><span class="brandFilterValue">'+esc(label)+'</span><svg class="brandFilterChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg></button><div class="brandFilterMenu" role="listbox">'+[['',null,'All Brands'],...items.map(([b,n])=>[b,n,b])].map(([b,n,text])=>'<button type="button" class="brandFilterOption '+((brandFilter||'')===b?'selected':'')+'" data-brand="'+esc(b)+'" onclick="setBrandFilter(this.dataset.brand)" role="option" aria-selected="'+((brandFilter||'')===b)+'"><span class="brandFilterOptionMain"><span class="brandFilterCheck">'+((brandFilter||'')===b?'✓':'')+'</span><span>'+esc(text)+'</span></span>'+(n!==null?'<span class="brandFilterCount">'+n+'</span>':'')+'</button>').join('')+'</div></div>'}
function toggleBrandMenu(e){e.stopPropagation();let el=document.getElementById('brandFilter');if(!el)return;el.classList.toggle('open');el.querySelector('.brandFilterButton')?.setAttribute('aria-expanded',el.classList.contains('open'))}
function setBrandFilter(value){let target=String(value||'').trim();let match=target?getBrandCounts().find(([b])=>b.trim().toLowerCase()===target.toLowerCase()):null;brandFilter=match?match[0]:'';let el=document.getElementById('brandFilter');if(el){el.classList.remove('open');let items=getBrandCounts();let selected=brandFilter?items.find(([b])=>b.trim().toLowerCase()===brandFilter.trim().toLowerCase()):null;el.querySelector('.brandFilterValue').textContent=selected?selected[0]+' ('+selected[1]+')':'All Brands';el.querySelectorAll('.brandFilterOption').forEach(o=>{let b=o.dataset.brand||'';let active=(b.toLowerCase()===String(brandFilter||'').toLowerCase());o.classList.toggle('selected',active);o.setAttribute('aria-selected',active?'true':'false');let check=o.querySelector('.brandFilterCheck');if(check)check.textContent=active?'✓':''})}updateHomeResults()}
document.addEventListener('click',e=>{let el=document.getElementById('brandFilter');if(el&&!el.contains(e.target))el.classList.remove('open');document.querySelectorAll('.formSelect.open').forEach(x=>{if(!x.contains(e.target))x.classList.remove('open')})});
function getFilteredWatches(){let selectedBrand=String(brandFilter||'').trim().toLowerCase();let q=String(query||'').trim().toLowerCase();return watches.filter(w=>{let sameStatus=w.status===filter;let sameBrand=!selectedBrand||String(w.brand||'').trim().toLowerCase()===selectedBrand;let matchesQuery=!q||JSON.stringify(w).toLowerCase().includes(q);return sameStatus&&sameBrand&&matchesQuery})}
function updateHomeResults(){
let list=getFilteredWatches(),h=$('#homeResults');if(!h)return;
window._watchDomImageCache=window._watchDomImageCache||new Map();
h.querySelectorAll('img.cover[data-image-src]').forEach(img=>{
  const src=img.dataset.imageSrc;
  if(src)window._watchDomImageCache.set(src,img);
});
h.innerHTML=list.length?'<div class="head"><h2>'+(filter==='owned'?'My Watches':'Archive')+'</h2><span class="small">'+list.length+' entries</span></div><div class="grid">'+list.map(card).join('')+'</div>':'<div class="head"><h2>'+(filter==='owned'?'My Watches':'Archive')+'</h2><span class="small">0 entries</span></div><div class="empty">검색 결과가 없어.</div>';
h.querySelectorAll('img.cover[data-image-src]').forEach(img=>{
  const src=img.dataset.imageSrc;
  const cached=window._watchDomImageCache.get(src);
  if(cached && cached!==img){
    cached.className=img.className;
    cached.alt=img.alt;
    cached.decoding=img.decoding;
    cached.fetchPriority=img.fetchPriority;
    cached.dataset.imageSrc=src;
    img.replaceWith(cached);
  }else if(cached!==img){
    window._watchDomImageCache.set(src,img);
  }
});
}
function renderHome(){
if(detail){renderDetail();return}
let o=watches.filter(w=>w.status==='owned').length,a=watches.filter(w=>w.status==='archive').length;

// Keep the Daily Inspiration DOM node alive when switching My Watches / Archive.
// Re-rendering the whole home screen used to destroy and recreate the image element,
// which caused a visible reload/flicker even though the same photo was already loaded.
const preservedInspiration=document.querySelector('.inspiration');

$('#app').innerHTML='<main class="app"><div class="top"><div><div class="eyebrow">PERSONAL WATCH ARCHIVE</div><div class="brand">Watch Archive</div></div><button class="icon" onclick="settings()">⚙</button></div>'+dailyInspiration()+'<div class="tabs"><button class="tab '+(filter==='owned'?'active':'')+'" onclick="filter=\'owned\';query=\'\';renderHome()">My Watches '+o+'</button><button class="tab '+(filter==='archive'?'active':'')+'" onclick="filter=\'archive\';query=\'\';renderHome()">Archive '+a+'</button></div><input id="homeSearch" class="search" placeholder="브랜드, 모델, 레퍼런스, 태그 검색" value="'+esc(query)+'" oninput="query=this.value;updateHomeResults()">'+brandFilterHtml()+'<div id="homeResults"></div></main><button class="fab" onclick="openEditor()">＋</button>'+nav();

const renderedInspiration=document.querySelector('.inspiration');
if(preservedInspiration&&renderedInspiration){
  renderedInspiration.replaceWith(preservedInspiration);
}

updateHomeResults()
}
function card(w){let src=cover(w);return`<article class="card" onclick="openDetail('${w.id}')">${src?`<img class="cover" src="${src}" data-image-src="${src}" decoding="async" fetchpriority="low">`:`<div class="cover"></div>`}<div class="cardbody"><div class="cardbrand">${esc(w.brand||'BRAND')}</div><div class="model">${esc(w.model||'Untitled')}</div>${w.favorite?'<span class="badge">♥ FAVORITE</span>':''}</div></article>`}
function openDetail(id){detail=id;renderDetail()}function closeDetail(){detail=null;renderHome()}
function orderedPhotos(w){let ps=[...(w.photos||[])];if(!ps.length)return[];let i=ps.findIndex(p=>p.cover);if(i>0){let c=ps.splice(i,1)[0];ps.unshift(c)}return ps}
let zoomState={scale:1,x:0,y:0,pinchStart:0,pinchStartScale:1,pinchBaseX:0,pinchBaseY:0,pinchCenterX:0,pinchCenterY:0,pinchContentX:0,pinchContentY:0,dragStartX:0,dragStartY:0,dragOriginX:0,dragOriginY:0,lastTap:0};
function resetZoom(){zoomState={scale:1,x:0,y:0,pinchStart:0,pinchStartScale:1,pinchBaseX:0,pinchBaseY:0,pinchCenterX:0,pinchCenterY:0,pinchContentX:0,pinchContentY:0,dragStartX:0,dragStartY:0,dragOriginX:0,dragOriginY:0,lastTap:0};let t=$('#lightboxTrack');t?.classList.remove('zoomActive');t?.querySelectorAll('.lightboxSlide').forEach(s=>s.classList.remove('zoomed'));t?.querySelectorAll('img').forEach(img=>img.style.transform='translate3d(0,0,0) scale(1)')}
function applyZoom(){let slide=activeZoomSlide(),img=slide?.querySelector('img');if(!img)return;img.style.transform='translate3d('+zoomState.x+'px,'+zoomState.y+'px,0) scale('+zoomState.scale+')';slide.classList.toggle('zoomed',zoomState.scale>1.01);$('#lightboxTrack')?.classList.toggle('zoomActive',zoomState.scale>1.01)}
function activeZoomSlide(){let t=$('#lightboxTrack');if(!t)return null;let n=Math.round(t.scrollLeft/t.clientWidth);return t.children[n]}
function pinchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function zoomDoubleTap(e){e.preventDefault();let now=Date.now();if(now-zoomState.lastTap<300){zoomState.scale=zoomState.scale>1.01?1:1.75;zoomState.x=0;zoomState.y=0;applyZoom()}zoomState.lastTap=now}
function zoomTouchStart(e){if(e.touches.length===2){e.preventDefault();let a=e.touches[0],b=e.touches[1],slide=e.currentTarget,rect=slide.getBoundingClientRect();zoomState.pinchStart=pinchDistance(a,b);zoomState.pinchStartScale=zoomState.scale;zoomState.pinchBaseX=zoomState.x;zoomState.pinchBaseY=zoomState.y;zoomState.pinchCenterX=((a.clientX+b.clientX)/2)-rect.left-rect.width/2;zoomState.pinchCenterY=((a.clientY+b.clientY)/2)-rect.top-rect.height/2;zoomState.pinchContentX=(zoomState.pinchCenterX-zoomState.x)/zoomState.scale;zoomState.pinchContentY=(zoomState.pinchCenterY-zoomState.y)/zoomState.scale;return}if(e.touches.length===1&&zoomState.scale>1.01){e.preventDefault();zoomState.dragStartX=e.touches[0].clientX;zoomState.dragStartY=e.touches[0].clientY;zoomState.dragOriginX=zoomState.x;zoomState.dragOriginY=zoomState.y}}
function zoomTouchMove(e){if(e.touches.length===2){e.preventDefault();if(!zoomState.pinchStart)return;let d=pinchDistance(e.touches[0],e.touches[1]);let delta=d-zoomState.pinchStart;let scale=zoomState.pinchStartScale+(delta*0.004);zoomState.scale=Math.max(1,Math.min(3,scale));if(zoomState.scale<=1.01){zoomState.scale=1;zoomState.x=0;zoomState.y=0}else{zoomState.x=zoomState.pinchCenterX-zoomState.pinchContentX*zoomState.scale;zoomState.y=zoomState.pinchCenterY-zoomState.pinchContentY*zoomState.scale}applyZoom();return}if(e.touches.length===1&&zoomState.scale>1.01){e.preventDefault();zoomState.x=zoomState.dragOriginX+(e.touches[0].clientX-zoomState.dragStartX);zoomState.y=zoomState.dragOriginY+(e.touches[0].clientY-zoomState.dragStartY);applyZoom()}}
function zoomTouchEnd(e){if(e.touches.length<2)zoomState.pinchStart=0;if(e.touches.length===0&&zoomState.scale<=1.01){zoomState.scale=1;zoomState.x=0;zoomState.y=0;applyZoom()}}
function bindZoom(){let t=$('#lightboxTrack');if(!t)return;t.querySelectorAll('.lightboxSlide').forEach(slide=>{slide.addEventListener('touchstart',zoomTouchStart,{passive:false});slide.addEventListener('touchmove',zoomTouchMove,{passive:false});slide.addEventListener('touchend',zoomTouchEnd,{passive:false});slide.addEventListener('dblclick',zoomDoubleTap);slide.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false})});t.addEventListener('scroll',()=>{if(zoomState.scale<=1.01){resetZoom();updateLightboxCount()}},{passive:true})}
function openLightbox(id,index=0){let w=watches.find(x=>x.id===id);if(!w||!w.photos?.length)return;let ps=orderedPhotos(w);closeLightbox();$('#app').insertAdjacentHTML('beforeend',`<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()"><button class="lightboxClose" onclick="closeLightbox()">×</button><div class="lightboxTrack" id="lightboxTrack">${ps.map(p=>`<div class="lightboxSlide"><img src="${p.src}" alt="Watch photo"></div>`).join('')}</div><div class="lightboxHint" id="lightboxHint">Pinch to zoom · Double tap</div><div class="lightboxCount" id="lightboxCount">${index+1} / ${ps.length}</div></div>`);let t=$('#lightboxTrack');requestAnimationFrame(()=>{t.scrollLeft=t.clientWidth*Math.max(0,Math.min(index,ps.length-1));resetZoom();bindZoom();updateLightboxCount();setTimeout(()=>$('#lightboxHint')?.remove(),1800)})}

function closeLightbox(){$('#lightbox')?.remove();zoomState.scale=1}
function renderHero(w,watchPager=''){let ps=orderedPhotos(w);if(!ps.length)return '';return`<div class="heroGallery"><div class="heroTrack" id="heroTrack" onscroll="updateHeroDots()">${ps.map((p,i)=>`<div class="heroSlide"><img src="${p.src}" alt="Watch photo ${i+1}" onclick="openLightbox('${w.id}',${i})"></div>`).join('')}</div>${watchPager?`<div class="watchPager heroWatchPager">${watchPager}</div>`:''}<div class="heroCount" id="heroCount">1 / ${ps.length}</div>${ps.length>1?`<div class="heroDots">${ps.map((_,i)=>`<button type="button" class="heroDot ${i===0?'active':''}" aria-label="사진 ${i+1}" onclick="event.stopPropagation();heroTo(${i})"></button>`).join('')}</div>`:''}</div>`}
function heroTo(i){let t=$('#heroTrack');if(t)t.scrollTo({left:t.clientWidth*i,behavior:'smooth'})}
function updateHeroDots(){let t=$('#heroTrack');if(!t)return;let i=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('.heroDot').forEach((d,n)=>d.classList.toggle('active',n===i));let count=$('#heroCount');if(count)count.textContent=`${i+1} / ${t.children.length}`}
function photoTypeLabel(t){return ({watch:'WATCH',wrist:'WRIST SHOT',detail:'DETAIL',movement:'MOVEMENT',strap:'STRAP',lifestyle:'LIFESTYLE'})[t]||'WATCH'}
function renderDetail(){
 let idx=watches.findIndex(x=>x.id===detail);
 if(idx<0)return closeDetail();
 let scoped=watches.filter(x=>x.status===filter);
 let idxInScope=scoped.findIndex(x=>x.id===detail);
 if(idxInScope<0){scoped=watches;idxInScope=scoped.findIndex(x=>x.id===detail)}
 let w=watches[idx], prev=scoped[(idxInScope-1+scoped.length)%scoped.length], next=scoped[(idxInScope+1)%scoped.length];
 $('#app').innerHTML=`<main class="detail" id="detailSwipe">${w.photos?.length?renderHero(w,`${idxInScope+1} / ${scoped.length}`):''}<div class="detailpad"><button class="icon" onclick="closeDetail()">←</button><div class="detailbrand">${esc(w.brand||'BRAND')}</div><div class="detailmodel">${esc(w.model||'Untitled')}</div><div class="pills">${[['Ref.',w.reference],['Size',w.size],['Year',w.year],['Movement',w.movement]].filter(x=>x[1]).map(x=>`<span class="pill">${esc(x[0])} ${esc(x[1])}</span>`).join('')}</div>${w.note?`<div class="head"><h2>My Note</h2></div><div class="note">${esc(w.note)}</div>`:''}${w.photos?.some(p=>p.note)?`<div class="head"><h2>Photo Notes</h2></div>${w.photos.filter(p=>p.note).map(p=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--line)">${photoTypeLabel(p.type)} · ${esc(p.note)}</div>`).join('')}`:''}${w.tags?.length?`<div class="pills" style="margin:16px 0">${w.tags.map(t=>`<span class="pill">#${esc(t)}</span>`).join('')}</div>`:''}<div class="head"><h2>Photos</h2><span class="small">${w.photos.length}</span></div><div class="detailphotos">${w.photos.map((p,i)=>`<button type="button" onclick="openLightbox('${w.id}',${i})"><img src="${p.src}" alt="Watch photo"><span style="position:absolute;left:5px;bottom:5px;background:#111b;color:#fff;padding:3px 5px;font-size:8px">${photoTypeLabel(p.type)}</span></button>`).join('')}</div><div class="actions"><button onclick="openEditor(watches.find(x=>x.id==='${w.id}'))">Edit</button><button onclick="favorite('${w.id}')">${w.favorite?'♥ Favorite':'♡ Favorite'}</button><button onclick="delWatch('${w.id}')" class="delete">Delete</button></div><div class="watchNav"><button onclick="openDetail('${prev.id}')">← Previous</button><button onclick="openDetail('${next.id}')">Next →</button></div></div></main>`;
 const area=document.getElementById('detailSwipe');
 if(area){let sx=0,sy=0,st=0;area.addEventListener('touchstart',e=>{let t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});area.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;if(dt<700&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.25)openDetail(dx<0?next.id:prev.id)},{passive:true})}
}
async function favorite(id){let w=watches.find(x=>x.id===id);if(!w)return;let{error}=await supabaseClient.from('watches').update({favorite:!w.favorite}).eq('id',id).eq('user_id',currentUser.id);if(error)return toast('저장에 실패했어요');await load()}
async function delWatch(id){if(!confirm('이 시계를 삭제할까요?'))return;let w=watches.find(x=>x.id===id);if(w?.photos?.length)await supabaseClient.storage.from('watch-photos').remove(w.photos.map(p=>p.path).filter(Boolean));let{error}=await supabaseClient.from('watches').delete().eq('id',id).eq('user_id',currentUser.id);if(error){toast('삭제에 실패했어요');return}detail=null;await load();toast('삭제했어요')}
function openEditor(w=null){editing=w?.id||null;editPhotos=w?JSON.parse(JSON.stringify(w.photos||[])):[];editStatus=w?.status||filter;renderEditor()}
function setStatus(s){editStatus=s;renderEditor()}
function renderEditor(){let w=editing?watches.find(x=>x.id===editing):null;$('#app').innerHTML=`<div class="overlay"><section class="sheet"><div class="sheettop"><h1 class="title">${w?'Edit Watch':'New Watch'}</h1><button class="close" onclick="renderHome()">×</button></div><div class="field"><label>Photos</label><div class="photoactions"><button class="action" onclick="$('#gallery').click()">＋ 사진 보관함에서 추가</button></div><input id="gallery" class="hidden" type="file" accept="image/*" multiple onchange="addFiles(this)"><div class="photos">${editPhotos.map((p,i)=>`<div class="photo"><img src="${p.src}"><button onclick="editPhotos.splice(${i},1);renderEditor()">×</button>${p.cover?'<span class="covermark">COVER</span>':''}</div>`).join('')}</div></div><div class="field"><label>Collection</label><div class="status"><button class="${editStatus==='owned'?'active':''}" onclick="setStatus('owned')">My Watch</button><button class="${editStatus==='archive'?'active':''}" onclick="setStatus('archive')">Archive</button></div></div><div class="formgrid"><div class="field"><label>Brand</label>${brandSelect(w?.brand||'')}</div><div class="field"><label>Model</label><input id="model" value="${esc(w?.model)}" placeholder="Oyster Perpetual Date"></div><div class="field"><label>Reference</label><input id="reference" value="${esc(w?.reference)}" placeholder="1500"></div><div class="field"><label>Size</label><input id="size" type="text" inputmode="numeric" autocomplete="off" value="${esc(sizeNumber(w?.size||''))}" placeholder="34"></div><div class="field"><label>Movement</label>${formSelectHtml("movement",[["Manual","Manual"],["Automatic","Automatic"],["Quartz","Quartz"]],w?.movement||"")}</div>${editStatus==='owned'?`<div class="field"><label>Purchase Price</label><input id="purchasePrice" type="text" inputmode="numeric" autocomplete="off" value="${esc(w?.purchase_price!=null?Number(w.purchase_price).toLocaleString('ko-KR'): '')}" placeholder="1,500,000" oninput="formatPurchasePriceInput(this)"></div>`:''}<div class="field full"><label>Tags</label><input id="tags" value="${esc(w?.tags?.join(', '))}" placeholder="vintage, silver dial, 34mm"></div><div class="field full"><label>My Note</label><textarea id="note">${esc(w?.note)}</textarea></div></div><div class="field full"><label>PHOTO DETAILS</label><div class="small">각 사진의 종류와 메모를 설정할 수 있어.</div><div style="margin-top:10px">${editPhotos.map((p,i)=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div style="display:flex;gap:8px;align-items:center"><img src="${p.src}" style="width:52px;height:52px;object-fit:cover"><div style="flex:1">${formSelectHtml('photoType'+i,[['watch','Watch'],['wrist','Wrist Shot'],['detail','Detail'],['movement','Movement'],['strap','Strap'],['lifestyle','Lifestyle']],p.type||'watch')}</div></div><input style="margin-top:7px" value="${esc(p.note||'')}" placeholder="이 사진에 대한 메모" oninput="editPhotos[${i}].note=this.value"></div>`).join('')}</div></div><button class="action primary" style="margin-top:16px" onclick="save()">Save Watch</button></section></div>`}
function normalizeSizeValue(v){
 v=String(v||'').trim().replace(/mm/gi,'').trim();
 return v ? v+'mm' : '';
}
function formatPurchasePriceInput(el){if(!el)return;let digits=String(el.value||'').replace(/[^0-9]/g,'');el.value=digits?Number(digits).toLocaleString('ko-KR'):''}
function normalizeSizeField(){
 const el=document.getElementById('size');
 if(el) el.value=normalizeSizeValue(el.value);
}
async function save(){let old=editing?watches.find(x=>x.id===editing):null;if(!$('#brand').value.trim()||!$('#model').value.trim())return toast('브랜드와 모델을 입력해주세요');if(editPhotos.length&&!editPhotos.some(p=>p.cover))editPhotos[0].cover=true;let watchId=old?.id||uid();let purchasePriceEl=document.getElementById('purchasePrice');let purchasePrice=purchasePriceEl?Number(String(purchasePriceEl.value||'').replace(/[^0-9]/g,'')):null;let payload={id:watchId,user_id:currentUser.id,status:editStatus,brand:$('#brand').value.trim(),model:$('#model').value.trim(),reference:$('#reference').value.trim(),size:formatSizeInput($('#size').value),movement:$('#movement').value,tags:$('#tags').value.split(',').map(s=>s.trim()).filter(Boolean),note:$('#note').value.trim(),favorite:old?.favorite||false,purchase_price:editStatus==='owned'?(Number.isFinite(purchasePrice)&&purchasePrice>0?purchasePrice:null):null};let{error}=old?await supabaseClient.from('watches').update(payload).eq('id',watchId).eq('user_id',currentUser.id):await supabaseClient.from('watches').insert(payload);if(error){toast('시계 저장에 실패했어요');return}let oldPaths=new Set((old?.photos||[]).map(p=>p.path).filter(Boolean)),keptPaths=new Set();for(let i=0;i<editPhotos.length;i++){let p=editPhotos[i],path=p.path;if(!path){let ext=(p.src.match(/^data:image\/([^;]+)/)||[])[1]||'jpeg';ext=ext==='jpeg'?'jpg':ext;path=currentUser.id+'/'+watchId+'/'+p.id+'.'+ext;let blob=p.file||await(await fetch(p.src)).blob();let up=await supabaseClient.storage.from('watch-photos').upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'3600',upsert:false});if(up.error){toast('사진 업로드에 실패했어요');return}}keptPaths.add(path);let{error:pe}=await supabaseClient.from('watch_photos').upsert({id:p.id,user_id:currentUser.id,watch_id:watchId,storage_path:path,is_cover:!!p.cover,sort_order:i,photo_type:p.type||'watch',note:p.note||null});if(pe){toast('사진 정보 저장에 실패했어요');return}}let removed=[...oldPaths].filter(x=>!keptPaths.has(x));if(removed.length){await supabaseClient.storage.from('watch-photos').remove(removed);await supabaseClient.from('watch_photos').delete().eq('watch_id',watchId).eq('user_id',currentUser.id).in('storage_path',removed)}editing=null;await load();toast(old?'수정했어요':'저장했어요')}
function photosPage(){let a=watches.flatMap(w=>w.photos.map(p=>({w,p})));$('#app').innerHTML=`<main class="app"><div class="top"><div><div class="eyebrow">ALL PHOTOS</div><div class="brand">Photos</div></div></div>${a.length?`<div class="grid">${a.map(x=>`<article class="card" onclick="openDetail('${x.w.id}')"><img class="cover" src="${x.p.src}"><div class="cardbody"><div class="cardbrand">${esc(x.w.brand)}</div><div class="meta">${esc(x.w.model)}</div></div></article>`).join('')}</div>`:'<div class="empty">아직 사진이 없어.</div>'}</main>${nav()}`}
function settings(){const email=esc(currentUser?.email||'');$('#app').innerHTML='<main class="app"><div class="top"><div><div class="eyebrow">ARCHIVE TOOLS</div><div class="brand">Settings</div></div></div><div class="head"><h2>Account</h2></div><div class="empty">Supabase Cloud Archive<br><span class="small">'+email+'</span><br><br><button class="action" onclick="signOut()">Sign out</button></div></main>'+nav()}
function updateTheme(){let h=new Date().getHours();let dark=h>=21||h<8;document.documentElement.classList.toggle('dark',dark);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#171614':'#f5f3ee')}
function scheduleTheme(){updateTheme();let now=new Date(),next=new Date(now);next.setMinutes(0,0,0);next.setHours(now.getHours()+1);let ms=next-now;setTimeout(()=>{updateTheme();scheduleTheme()},Math.max(ms,1000))}
scheduleTheme();
async function boot(){let{data}=await supabaseClient.auth.getSession();currentUser=data.session?.user||null;if(!currentUser){authScreen();return}await loadBrands();await load()}supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;if(currentUser){loadBrands().then(load)}else authScreen()});boot();
</script></body></html>
