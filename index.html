function openWatchImageDb(){

  try{const req=indexedDB.open('watch-archive-image-cache',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('images'))db.createObjectStore('images',{keyPath:'path'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)}catch(e){resolve(null)}

async function getCachedWatchImage(path){

 try{await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put({path,blob,size:blob.size,savedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}catch(e){console.warn('Image cache write skipped',e)}

let wearSelectedDate=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0');
let wearCalendarMonth=wearSelectedDate.slice(0,7),wearLogs=[];
function dateLabel(date){const d=new Date(date+'T12:00:00');return d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}
async function wearPage(){
 const app=$('#app');app.innerHTML='<main class="app"><div class="top"><div><div class="eyebrow">WRIST TIME</div><div class="brand">Wear Log</div></div></div><div id="wearContent"><div class="empty">착용 기록을 불러오는 중…</div></div></main>'+nav('wear');
 try{
  const {data,error}=await supabaseClient.from('wear_logs').select('id,watch_id,wear_date,created_at').eq('user_id',currentUser.id).order('wear_date',{ascending:false});
  if(error)throw error;

  renderWearContent();
 }catch(e){console.error('Wear log load failed',e);const el=$('#wearContent');if(el)el.innerHTML='<div class="empty">착용 기록을 불러오지 못했어. Supabase 설정을 확인해줘.</div>'}

function shiftWearMonth(delta){const d=new Date(wearCalendarMonth+'-15T12:00:00');d.setMonth(d.getMonth()+delta);wearCalendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderWearContent()}

function renderWearContent(){
 const root=$('#wearContent');if(!root)return;
 const owned=watches.filter(w=>w.status==='owned'&&w.possession_status!=='sold').sort((a,b)=>(a.brand+' '+a.model).localeCompare(b.brand+' '+b.model));
 const todayLog=wearLogs.find(x=>x.wear_date===wearSelectedDate);
 const selectedWatch=todayLog?watches.find(w=>w.id===todayLog.watch_id):null;
 const now=new Date(wearSelectedDate+'T12:00:00'),month=wearSelectedDate.slice(0,7);
 const monthLogs=wearLogs.filter(x=>x.wear_date.slice(0,7)===month);
 const counts={};monthLogs.forEach(x=>counts[x.watch_id]=(counts[x.watch_id]||0)+1);

 root.innerHTML=renderWearCalendar()+`<section class="wear-panel"><div class="eyebrow">DAILY CHECK-IN</div><h2 style="margin:8px 0 14px;font-size:23px">${dateLabel(wearSelectedDate)}</h2><div class="field" style="margin:0 0 14px"><label for="wearDate">기록 날짜</label><input id="wearDate" type="date" value="${wearSelectedDate}" max="${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}" onchange="wearSelectedDate=this.value;renderWearContent()" style="width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:12px;border-radius:10px"></div>${selectedWatch?`<div style="display:flex;align-items:center;gap:12px;margin:8px 0 14px">${selectedWatch.photos?.length?`<img src="${esc((selectedWatch.photos.find(p=>p.cover)||selectedWatch.photos[0]).src||'')}" alt="" style="width:76px;height:76px;object-fit:cover;border-radius:10px;background:var(--soft)">`:''}<div><div class="small">오늘의 대표 시계</div><strong>${esc(selectedWatch.brand)} ${esc(selectedWatch.model)}</strong></div></div><button class="action" onclick="clearWearLog()">기록 삭제</button>`:`<p class="small" style="margin:0 0 12px">이 날짜에 가장 대표적으로 착용한 시계를 선택해줘.</p>`}${owned.length?`<div class="field" style="margin-top:16px"><label for="wearWatch">대표 시계</label><select id="wearWatch" class="field-select" style="width:100%"><option value="">시계를 선택해줘</option>${owned.map(w=>`<option value="${esc(w.id)}" ${todayLog?.watch_id===w.id?'selected':''}>${esc(w.brand)} · ${esc(w.model)}</option>`).join('')}</select></div><button class="action primary" style="margin-top:10px" onclick="saveWearLog()">${todayLog?'기록 수정':'착용 기록 저장'}</button>`:'<p class="small">My Watches에 보유 시계를 먼저 등록해줘.</p>'}</section><div class="head"><h2>${month} 통계</h2><span class="small">${monthLogs.length}일 기록</span></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px"><div class="wear-stat"><div class="small">기록한 날짜</div><div class="wear-stat-value">${monthLogs.length}<span class="small"> 일</span></div></div><div class="wear-stat"><div class="small">최근 30일</div><div class="wear-stat-value">${recentDays}<span class="small"> 일</span></div></div></div><div class="head"><h2>자주 착용한 시계</h2><span class="small">이번 달</span></div>${ranked.length?ranked.map(([id,count],i)=>{const w=watches.find(x=>x.id===id);if(!w)return '';const pct=Math.round(count/Math.max(1,monthLogs.length)*100);return `<div class="wear-rank-row">${w.photos?.length?`<img src="${esc((w.photos.find(p=>p.cover)||w.photos[0]).src||'')}" alt="" class="wear-thumb">`:'<div class="wear-thumb" style="display:grid;place-items:center">⌚</div>'}<div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--muted)">#${i+1}</div><strong>${esc(w.brand)} ${esc(w.model)}</strong><div class="wear-rank-track"><div class="wear-rank-fill" style="width:${pct}%"></div></div></div><strong>${count}회</strong></div>`}).join(''):'<div class="empty">이번 달 착용 기록이 아직 없어.</div>'}<div class="head" style="margin-top:26px"><h2>최근 기록</h2><span class="small">최근 10건</span></div>${wearLogs.slice(0,10).length?wearLogs.slice(0,10).map(log=>{const w=watches.find(x=>x.id===log.watch_id);return `<button class="action" style="display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;margin-bottom:7px;border-radius:10px" onclick="wearSelectedDate='${log.wear_date}';renderWearContent()"><span><strong>${dateLabel(log.wear_date)}</strong><br><span class="small">${w?esc(w.brand+' '+w.model):'삭제된 시계'}</span></span><span>›</span></button>`}).join(''):'<div class="empty">기록이 쌓이면 여기에 표시돼.</div>'}`;
}
async function saveWearLog(){
 const watchId=$('#wearWatch')?.value;if(!watchId)return toast('대표 시계를 선택해줘');
 const existing=wearLogs.find(x=>x.wear_date===wearSelectedDate);
 const payload={user_id:currentUser.id,watch_id:watchId,wear_date:wearSelectedDate,updated_at:new Date().toISOString()};
 const {data,error}=await supabaseClient.from('wear_logs').upsert(payload,{onConflict:'user_id,wear_date'}).select('id,watch_id,wear_date,created_at').single();
 if(error){console.error(error);return toast('착용 기록 저장에 실패했어')}
 wearLogs=wearLogs.filter(x=>x.wear_date!==wearSelectedDate);wearLogs.push(data);wearLogs.sort((a,b)=>b.wear_date.localeCompare(a.wear_date));renderWearContent();toast(existing?'착용 기록을 수정했어':'착용 기록을 저장했어');

async function clearWearLog(){
