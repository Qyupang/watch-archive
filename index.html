<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>Watch Archive</title>
<style>
:root{--bg:#f5f3ee;--paper:#fffdf8;--ink:#171717;--muted:#77736b;--line:#d9d5cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:78px}
.app{max-width:760px;margin:auto;padding:22px 18px}.top{display:flex;justify-content:space-between;align-items:end;margin:10px 0 24px}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:700}.brand,.title{font-family:Georgia,serif}.brand{font-size:40px;margin-top:5px}
button,input,textarea{font:inherit}button{cursor:pointer}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:transparent}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:transparent;color:var(--muted)}.tab.active{background:#111;color:#fff}
.search{width:100%;padding:13px;border:1px solid var(--line);background:var(--paper);margin-bottom:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--paper);border:1px solid var(--line);padding:15px}.stat b{font:30px Georgia,serif}.stat span{display:block;font-size:10px;color:var(--muted);letter-spacing:.15em;margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 12px}.head h2{font:25px Georgia,serif;margin:0}.small{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--paper);border:1px solid var(--line);overflow:hidden}.cover{width:100%;aspect-ratio:1;object-fit:cover;background:#e5e1d8;display:block}.cardbody{padding:12px}.cardbrand{font-size:9px;letter-spacing:.18em;color:var(--muted);font-weight:700;text-transform:uppercase}.model{font:23px Georgia,serif;margin:5px 0}.meta{font-size:11px;color:var(--muted)}.badge{display:inline-block;border:1px solid var(--line);padding:4px 6px;font-size:9px;margin-top:8px}
.empty{border:1px dashed var(--line);padding:35px 18px;text-align:center;color:var(--muted);background:#fff8}
.fab{position:fixed;right:20px;bottom:82px;width:58px;height:58px;border:0;border-radius:50%;background:#111;color:#fff;font-size:29px;z-index:5}
.navbar{position:fixed;bottom:0;left:0;right:0;background:#f5f3eeed;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:4}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav{border:0;background:transparent;padding:10px;color:var(--muted);font-size:10px}.nav.active{color:#111;font-weight:700}.nav span{display:block;font-size:19px;margin-bottom:3px}
.overlay{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-end}.sheet{width:100%;max-height:94vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:20px 18px 38px}.sheettop{display:flex;justify-content:space-between;align-items:center}.title{font-size:31px;margin:0}.close{border:0;border-radius:50%;width:40px;height:40px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin-top:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fff;padding:12px}.field textarea{min-height:105px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.status button{padding:12px;border:1px solid var(--line);background:#fff}.status button.active{background:#111;color:#fff}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.photo{position:relative;aspect-ratio:1}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:4px;top:4px;border:0;background:#fff;border-radius:50%;width:27px;height:27px}.covermark{position:absolute;left:4px;bottom:4px;background:#111;color:#fff;padding:3px 5px;font-size:8px}
.photoactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.action{width:100%;padding:12px;border:1px solid var(--line);background:#fff}.primary{background:#111;color:#fff;border-color:#111}
.heroGallery{position:relative;width:100%;background:#e5e1d8;overflow:hidden}.heroTrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}.heroTrack::-webkit-scrollbar{display:none}.heroSlide{flex:0 0 100%;width:100%;height:min(65vh,620px);scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#e5e1d8}.heroSlide img{width:100%;height:100%;object-fit:cover;display:block}.heroCount{position:absolute;right:12px;bottom:12px;background:#111b;color:#fff;padding:5px 9px;border-radius:999px;font-size:10px;z-index:2}.heroDots{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);display:flex;gap:5px;z-index:2}.heroDot{width:5px;height:5px;border-radius:50%;background:#fff9;border:0;padding:0}.heroDot.active{background:#fff}.detailpad{padding:20px}.detailbrand{font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:700}.detailmodel{font:42px Georgia,serif;margin:7px 0 16px}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);padding:6px 9px;font-size:11px}.note{font-size:17px;line-height:1.65;white-space:pre-wrap}.detailphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.detailphotos button{border:0;padding:0;background:none;position:relative;aspect-ratio:1;overflow:hidden}.detailphotos img{width:100%;height:100%;object-fit:cover;display:block}.actions{display:flex;gap:7px;margin-top:22px}.actions button{flex:1;padding:12px;border:1px solid var(--line);background:#fff}.lightbox{position:fixed;inset:0;background:#000f;z-index:50;display:flex;align-items:center;justify-content:center}.lightboxTrack{width:100%;height:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.lightboxTrack::-webkit-scrollbar{display:none}.lightboxSlide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:22px}.lightboxSlide img{max-width:100%;max-height:88%;object-fit:contain}.lightboxClose{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#111;font-size:25px;z-index:2}.lightboxCount{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:6px 10px;border-radius:999px;font-size:10px;z-index:2}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:999px;font-size:11px;z-index:60}.hidden{display:none!important}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.overlay{align-items:center}.sheet{max-width:650px;border-radius:24px;max-height:90vh}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const DB='watch-archive-v2',STORE='watches',BRANDS_KEY='watch-archive-brands-v1';
const DEFAULT_BRANDS=['Rolex','Omega','TAG Heuer','Tudor','Cartier','Jaeger-LeCoultre','Patek Philippe','Audemars Piguet','Vacheron Constantin','Breguet','Breitling','IWC','Zenith','Hublot','Longines','Grand Seiko','Seiko','Citizen','Casio','Timex','Bulgari','Piaget','Panerai','Hamilton','Oris','Nomos','Sinn','Tissot','Rado','Heuer'];
let db,watches=[],filter='owned',query='',detail=null,editing=null,editPhotos=[],editStatus='owned',brands=[];
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadBrands(){try{let saved=JSON.parse(localStorage.getItem(BRANDS_KEY)||'[]');brands=[...new Set([...DEFAULT_BRANDS,...(Array.isArray(saved)?saved:[])].filter(Boolean))]}catch(e){brands=[...DEFAULT_BRANDS]}}
function saveBrands(){localStorage.setItem(BRANDS_KEY,JSON.stringify(brands))}
function addBrand(){let name=prompt('추가할 브랜드명을 입력하세요.');if(!name)return '';name=name.trim();if(!name)return '';let existing=brands.find(b=>b.toLowerCase()===name.toLowerCase());if(existing)return existing;brands.push(name);brands.sort((a,b)=>a.localeCompare(b));saveBrands();return name}
function brandSelect(value=''){let current=value||'';let opts=brands.map(b=>`<option value="${esc(b)}" ${b===current?'selected':''}>${esc(b)}</option>`).join('');if(current&&!brands.includes(current))opts=`<option value="${esc(current)}" selected>${esc(current)}</option>`+opts;return `<div style="display:grid;grid-template-columns:1fr auto;gap:7px"><select id="brand" style="width:100%;border:1px solid var(--line);background:#fff;padding:12px" onchange="if(this.value==='__add__'){let n=addBrand();if(n){this.innerHTML=brandOptions(n);this.value=n}}"><option value="" ${!current?'selected':''}>브랜드 선택</option>${opts}<option value="__add__">＋ 새 브랜드 추가</option></select><button type="button" class="action" style="padding:12px 14px" onclick="let n=addBrand();if(n){let s=$('#brand');s.innerHTML=brandOptions(n);s.value=n}">＋</button></div>`}
function brandOptions(selected=''){let current=selected||'';return `<option value="" ${!current?'selected':''}>브랜드 선택</option>${brands.map(b=>`<option value="${esc(b)}" ${b===current?'selected':''}>${esc(b)}</option>`).join('')}<option value="__add__">＋ 새 브랜드 추가</option>`}
function toast(x){let t=$('#toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1600)}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function all(){return new Promise((ok,no)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}
function put(x){return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function remove(id){return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function imgFile(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function addFiles(input){let a=await Promise.all([...input.files].map(imgFile));editPhotos.push(...a.map(src=>({id:uid(),src,cover:false})));renderEditor()}
function cover(w){return w.photos?.find(p=>p.cover)?.src||w.photos?.[0]?.src||''}
function normalize(x){let ps=(x.photos||[]).map(p=>typeof p==='string'?{id:uid(),src:p,cover:false}:{id:p.id||uid(),src:p.src||p.data||'',cover:!!p.cover});if(ps.length&&!ps.some(p=>p.cover))ps[0].cover=true;return{id:x.id||uid(),status:x.status||((x.owned||x.isOwned)?'owned':'archive'),brand:x.brand||'',model:x.model||x.name||'',reference:x.reference||x.ref||'',year:x.year||'',size:x.size||'',movement:x.movement||'',tags:Array.isArray(x.tags)?x.tags:String(x.tags||'').split(',').map(s=>s.trim()).filter(Boolean),note:x.note||x.notes||'',photos:ps,favorite:!!x.favorite,createdAt:x.createdAt||Date.now(),updatedAt:Date.now()}}
async function migrate(){for(const k of ['watches','watchArchive','watch-archive','watchData']){try{let v=JSON.parse(localStorage.getItem(k)||'null'),a=Array.isArray(v)?v:v?.watches||[];for(let x of a)await put(normalize(x))}catch(e){}}}
async function load(){watches=await all();renderHome()}
function nav(){return`<nav class="navbar"><div class="navin"><button class="nav active" onclick="renderHome()"><span>⌚</span>Watches</button><button class="nav" onclick="photosPage()"><span>▧</span>Photos</button><button class="nav" onclick="settings()"><span>⋯</span>Settings</button></div></nav>`}
function renderHome(){if(detail){renderDetail();return}let list=watches.filter(w=>w.status===filter&&(!query||JSON.stringify(w).toLowerCase().includes(query.toLowerCase()))),o=watches.filter(w=>w.status==='owned').length,a=watches.filter(w=>w.status==='archive').length;$('#app').innerHTML=`<main class="app"><div class="top"><div><div class="eyebrow">PERSONAL WATCH ARCHIVE</div><div class="brand">Watch Archive</div></div><button class="icon" onclick="settings()">⚙</button></div><div class="tabs"><button class="tab ${filter==='owned'?'active':''}" onclick="filter='owned';query='';renderHome()">My Watches ${o}</button><button class="tab ${filter==='archive'?'active':''}" onclick="filter='archive';query='';renderHome()">Archive ${a}</button></div><input class="search" placeholder="브랜드, 모델, 레퍼런스, 태그 검색" value="${esc(query)}" oninput="query=this.value;renderHome()"><div class="stats"><div class="stat"><b>${o}</b><span>MY WATCHES</span></div><div class="stat"><b>${a}</b><span>ARCHIVE</span></div></div><div class="head"><h2>${filter==='owned'?'My Watches':'Archive'}</h2><span class="small">${list.length} entries</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">아직 등록된 시계가 없어.<br><br>＋ 버튼으로 추가해보자.</div>`}</main><button class="fab" onclick="openEditor()">＋</button>${nav()}`}
function card(w){return`<article class="card" onclick="openDetail('${w.id}')">${cover(w)?`<img class="cover" src="${cover(w)}">`:`<div class="cover"></div>`}<div class="cardbody"><div class="cardbrand">${esc(w.brand||'BRAND')}</div><div class="model">${esc(w.model||'Untitled')}</div><div class="meta">${esc(w.reference||'—')} · ${esc(w.size||'—')}</div>${w.favorite?'<span class="badge">♥ FAVORITE</span>':''}</div></article>`}
function openDetail(id){detail=id;renderDetail()}function closeDetail(){detail=null;renderHome()}
function orderedPhotos(w){let ps=[...(w.photos||[])];if(!ps.length)return[];let i=ps.findIndex(p=>p.cover);if(i>0){let c=ps.splice(i,1)[0];ps.unshift(c)}return ps}
function openLightbox(id,index=0){let w=watches.find(x=>x.id===id);if(!w||!w.photos?.length)return;let ps=orderedPhotos(w);$('#app').insertAdjacentHTML('beforeend',`<div class="lightbox" id="lightbox"><button class="lightboxClose" onclick="closeLightbox()">×</button><div class="lightboxTrack" id="lightboxTrack">${ps.map(p=>`<div class="lightboxSlide"><img src="${p.src}"></div>`).join('')}</div><div class="lightboxCount" id="lightboxCount">${index+1} / ${ps.length}</div></div>`);let t=$('#lightboxTrack');t.scrollLeft=t.clientWidth*index;t.addEventListener('scroll',updateLightboxCount,{passive:true})}
function updateLightboxCount(){let t=$('#lightboxTrack');let n=Math.round(t.scrollLeft/t.clientWidth);$('#lightboxCount').textContent=`${n+1} / ${t.children.length}`}
function closeLightbox(){$('#lightbox')?.remove()}
function renderHero(w){let ps=orderedPhotos(w);if(!ps.length)return '';return`<div class="heroGallery"><div class="heroTrack" id="heroTrack" onscroll="updateHeroDots()">${ps.map(p=>`<div class="heroSlide"><img src="${p.src}" onclick="openLightbox('${w.id}',${ps.indexOf(p)})"></div>`).join('')}</div><div class="heroCount">${ps.length} photo${ps.length>1?'s':''}</div>${ps.length>1?`<div class="heroDots">${ps.map((_,i)=>`<button class="heroDot ${i===0?'active':''}" onclick="heroTo(${i})"></button>`).join('')}</div>`:''}</div>`}
function heroTo(i){let t=$('#heroTrack');if(t)t.scrollTo({left:t.clientWidth*i,behavior:'smooth'})}
function updateHeroDots(){let t=$('#heroTrack');if(!t)return;let i=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('.heroDot').forEach((d,n)=>d.classList.toggle('active',n===i))}
function renderDetail(){let w=watches.find(x=>x.id===detail);if(!w)return closeDetail();let ps=orderedPhotos(w);$('#app').innerHTML=`<main class="detail">${renderHero(w)}<div class="detailpad"><button class="icon" onclick="closeDetail()">←</button><div class="detailbrand">${esc(w.brand||'BRAND')}</div><div class="detailmodel">${esc(w.model||'Untitled')}</div><div class="pills">${[['Ref.',w.reference],['Size',w.size],['Year',w.year],['Movement',w.movement]].filter(x=>x[1]).map(x=>`<span class="pill">${esc(x[0])} ${esc(x[1])}</span>`).join('')}</div>${w.note?`<div class="head"><h2>My Note</h2></div><div class="note">${esc(w.note)}</div>`:''}${w.tags?.length?`<div class="pills" style="margin:16px 0">${w.tags.map(t=>`<span class="pill">#${esc(t)}</span>`).join('')}</div>`:''}<div class="head"><h2>Photos</h2><span class="small">${ps.length}</span></div><div class="detailphotos">${ps.map((p,i)=>`<button onclick="openLightbox('${w.id}',${i})"><img src="${p.src}" alt="${esc(w.model||'Watch')} photo ${i+1}"></button>`).join('')}</div><div class="actions"><button onclick="openEditor(watches.find(x=>x.id==='${w.id}'))">Edit</button><button onclick="favorite('${w.id}')">${w.favorite?'♥ Favorite':'♡ Favorite'}</button><button onclick="delWatch('${w.id}')">Delete</button></div></div></main>`}
async function favorite(id){let w=watches.find(x=>x.id===id);w.favorite=!w.favorite;await put(w);await load()}
async function delWatch(id){if(confirm('이 시계를 삭제할까요?')){await remove(id);detail=null;await load();toast('삭제했어요')}}
function openEditor(w=null){editing=w?.id||null;editPhotos=w?JSON.parse(JSON.stringify(w.photos||[])):[];editStatus=w?.status||filter;renderEditor()}
function setStatus(s){editStatus=s;renderEditor()}
function renderEditor(){let w=editing?watches.find(x=>x.id===editing):null;$('#app').innerHTML=`<div class="overlay"><section class="sheet"><div class="sheettop"><h1 class="title">${w?'Edit Watch':'New Watch'}</h1><button class="close" onclick="renderHome()">×</button></div><div class="field"><label>Photos</label><div class="photoactions"><button class="action" onclick="$('#gallery').click()">＋ 사진 보관함</button><button class="action" onclick="$('#camera').click()">◎ 카메라</button></div><input id="gallery" class="hidden" type="file" accept="image/*" multiple onchange="addFiles(this)"><input id="camera" class="hidden" type="file" accept="image/*" capture="environment" onchange="addFiles(this)"><div class="photos">${editPhotos.map((p,i)=>`<div class="photo"><img src="${p.src}"><button onclick="editPhotos.splice(${i},1);renderEditor()">×</button>${p.cover?'<span class="covermark">COVER</span>':''}</div>`).join('')}</div></div><div class="field"><label>Collection</label><div class="status"><button class="${editStatus==='owned'?'active':''}" onclick="setStatus('owned')">My Watch</button><button class="${editStatus==='archive'?'active':''}" onclick="setStatus('archive')">Archive</button></div></div><div class="formgrid"><div class="field"><label>Brand</label>${brandSelect(w?.brand||'')}</div><div class="field"><label>Model</label><input id="model" value="${esc(w?.model)}" placeholder="Oyster Perpetual Date"></div><div class="field"><label>Reference</label><input id="reference" value="${esc(w?.reference)}" placeholder="1500"></div><div class="field"><label>Year</label><input id="year" value="${esc(w?.year)}" placeholder="1960s"></div><div class="field"><label>Size</label><input id="size" value="${esc(w?.size)}" placeholder="34mm"></div><div class="field"><label>Movement</label><input id="movement" value="${esc(w?.movement)}" placeholder="Automatic"></div><div class="field full"><label>Tags</label><input id="tags" value="${esc(w?.tags?.join(', '))}" placeholder="vintage, silver dial, 34mm"></div><div class="field full"><label>My Note</label><textarea id="note">${esc(w?.note)}</textarea></div></div><button class="action primary" style="margin-top:16px" onclick="save()">Save Watch</button></section></div>`}
async function save(){let old=editing?watches.find(x=>x.id===editing):null;if(editPhotos.length&&!editPhotos.some(p=>p.cover))editPhotos[0].cover=true;let w={id:old?.id||uid(),status:editStatus,brand:$('#brand').value.trim(),model:$('#model').value.trim(),reference:$('#reference').value.trim(),year:$('#year').value.trim(),size:$('#size').value.trim(),movement:$('#movement').value.trim(),tags:$('#tags').value.split(',').map(s=>s.trim()).filter(Boolean),note:$('#note').value.trim(),photos:editPhotos,favorite:old?.favorite||false,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};await put(w);editing=null;await load();toast(old?'수정했어요':'저장했어요')}
function photosPage(){let a=watches.flatMap(w=>w.photos.map(p=>({w,p})));$('#app').innerHTML=`<main class="app"><div class="top"><div><div class="eyebrow">ALL PHOTOS</div><div class="brand">Photos</div></div></div>${a.length?`<div class="grid">${a.map(x=>`<article class="card" onclick="openDetail('${x.w.id}')"><img class="cover" src="${x.p.src}"><div class="cardbody"><div class="cardbrand">${esc(x.w.brand)}</div><div class="meta">${esc(x.w.model)}</div></div></article>`).join('')}</div>`:'<div class="empty">아직 사진이 없어.</div>'}</main>${nav()}`}
function settings(){$('#app').innerHTML=`<main class="app"><div class="top"><div><div class="eyebrow">ARCHIVE TOOLS</div><div class="brand">Settings</div></div></div><div class="head"><h2>Backup</h2></div><div class="empty" style="text-align:left"><b>Export Archive</b><p class="small">시계 정보와 사진을 JSON으로 백업합니다.</p><button class="action primary" onclick="exportData()">Export</button><br><br><b>Import Archive</b><p class="small">백업 JSON을 현재 아카이브에 추가합니다.</p><input type="file" accept="application/json" onchange="importData(this)"></div><div class="head"><h2>About</h2></div><div class="empty">Watch Archive V2<br><span class="small">Local-first · No Supabase required</span></div></main>${nav()}`}
async function exportData(){let data={version:2,exportedAt:new Date().toISOString(),watches:await all()},b=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='watch-archive-backup.json';a.click();URL.revokeObjectURL(a.href);toast('백업 파일을 만들었어요')}
async function importData(input){try{let d=JSON.parse(await input.files[0].text()),a=Array.isArray(d)?d:d.watches||[];for(let x of a)await put(normalize(x));await load();toast('가져왔어요')}catch(e){alert('백업 파일을 읽지 못했어요.')}}
async function boot(){loadBrands();await openDB();await migrate();await load()}boot();
</script></body></html>
