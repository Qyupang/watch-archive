<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Watch Archive">
<link rel="manifest" href="./manifest.webmanifest">
<title>Watch Archive</title>
<style>
:root{--bg:#f7f6f2;--ink:#181816;--muted:#77756d;--line:#deddd6;--card:#fffefa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:24px 16px 100px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0 22px}
.eyebrow,.label{font-size:9px;letter-spacing:.18em;color:var(--muted)}h1{font:400 29px Georgia,serif;margin:7px 0 0}
.actions{display:flex;gap:7px}.icon{width:40px;height:40px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.add,.save,.fav{background:var(--ink);color:#fff;border:0;padding:11px 15px;border-radius:3px;display:flex;gap:7px;align-items:center}
.hero{padding:38px 0 30px}.hero h2{font:400 36px/1.12 Georgia,serif;margin:9px 0}.hero p{color:var(--muted);font-size:13px}
.stats{display:flex;gap:25px;margin-top:22px}.stat strong{display:block;font:400 25px Georgia,serif}.stat span{font-size:9px;color:var(--muted);letter-spacing:.12em}
.search{height:45px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:9px;padding:0 12px}.search input{border:0;outline:0;width:100%;background:transparent}
.tags{display:flex;gap:7px;overflow:auto;padding:12px 0 25px}.tag{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:20px;padding:7px 11px;font-size:10px;color:var(--muted)}.tag.on{background:var(--ink);border-color:var(--ink);color:#fff}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.head h3{font:400 24px Georgia,serif;margin:6px 0}.count{font-size:9px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line)}.photo{position:relative;aspect-ratio:1;overflow:hidden;background:#e7e4dc}.photo img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:9px;top:9px;width:34px;height:34px;border:0;border-radius:50%;background:#ffffffe8;display:grid;place-items:center}.body{padding:13px}.brand{font-size:9px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}.model{font:400 18px Georgia,serif;margin:5px 0}.meta{font-size:9px;color:var(--muted)}.ctags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.ctags span{font-size:9px;color:#68665f}.empty{text-align:center;padding:60px 10px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;padding:10px 20px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#f7f6f2f5;backdrop-filter:blur(10px);display:flex;justify-content:center;gap:55px;z-index:5}.nav span{font-size:9px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;position:relative}.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:50%;background:#fff;z-index:2}.detailImg{width:100%;max-height:55vh;object-fit:cover;display:block}.detail{padding:22px}.detail h2,.form h2{font:400 30px Georgia,serif;margin:5px 0 16px}.facts{display:flex;gap:6px;margin:15px 0}.facts span{border:1px solid var(--line);padding:7px 9px;font-size:10px}.note{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.note p{font:17px/1.55 Georgia,serif}.row{display:flex;gap:8px}.danger{border:1px solid #bbb8ae;background:transparent;padding:10px 13px}.form{padding:25px}.upload{height:175px;border:1px dashed #bbb8ae;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);overflow:hidden;margin:18px 0;cursor:pointer}.upload img{width:100%;height:100%;object-fit:cover}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:6px;margin-bottom:11px}label input,label textarea{border:1px solid var(--line);background:#fff;padding:11px;outline:0;font-size:13px}textarea{min-height:100px;resize:vertical}.save{width:100%;justify-content:center;margin-top:4px}.setting{border:1px solid var(--line);background:#fff;padding:15px;margin:9px 0}.setting b{font-size:13px}.setting p{font-size:11px;color:var(--muted);line-height:1.5}.secondary{border:1px solid var(--line);background:#fff;padding:9px 12px}.setting .secondary{margin-top:5px}.loading{text-align:center;padding-top:40vh;font:24px Georgia,serif}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.shell{padding-top:40px}.hero h2{font-size:46px}.hero{padding:55px 0 40px}}
</style>
</head>
<body>
<div id="app"><div class="loading">Watch Archive</div></div>
<script>
const DB_NAME="watch-archive-local", DB_VER=1;
let state={items:[],query:"",tag:"ALL",modal:null,editing:null};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>r.result.createObjectStore("watches",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function all(){const d=await openDB();return new Promise((res,rej)=>{let t=d.transaction("watches","readonly"),s=t.objectStore("watches"),r=s.getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>b.createdAt-a.createdAt));r.onerror=()=>rej(r.error)})}
async function put(x){const d=await openDB();return new Promise((res,rej)=>{let r=d.transaction("watches","readwrite").objectStore("watches").put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function del(id){const d=await openDB();return new Promise((res,rej)=>{let r=d.transaction("watches","readwrite").objectStore("watches").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function wipe(){const d=await openDB();return new Promise((res,rej)=>{let r=d.transaction("watches","readwrite").objectStore("watches").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function url(x){return x.image||"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 800'%3E%3Crect width='800' height='800' fill='%23e7e4dc'/%3E%3Ccircle cx='400' cy='400' r='230' fill='%23f8f5ec' stroke='%23333' stroke-width='25'/%3E%3Cpath d='M400 400V275M400 400l80 30' stroke='%23222' stroke-width='10' stroke-linecap='round'/%3E%3Ctext x='400' y='350' text-anchor='middle' font-family='Georgia' font-size='34'%3EWATCH%3C/text%3E%3C/svg%3E"}
function render(){let tags=["ALL",...new Set(state.items.flatMap(x=>x.tags||[]))];let filtered=state.items.filter(x=>(`${x.brand} ${x.model} ${x.reference} ${(x.tags||[]).join(" ")}`).toLowerCase().includes(state.query.toLowerCase())&&(state.tag==="ALL"||(x.tags||[]).includes(state.tag)));document.getElementById("app").innerHTML=`
<div class="shell"><header class="top"><div><div class="eyebrow">PRIVATE · LOCAL ONLY</div><h1>Watch Archive</h1></div><div class="actions"><button class="icon" onclick="settings()">⚙</button><button class="add" onclick="add()">＋ Add</button></div></header>
<section class="hero"><div class="label">MY HOROLOGY ARCHIVE</div><h2>Collect what catches your eye.</h2><p>사진과 시계 정보, 그리고 네가 느낀 것을 이 기기 안에만 보관해.</p><div class="stats"><div class="stat"><strong>${state.items.length}</strong><span>WATCHES</span></div><div class="stat"><strong>${state.items.filter(x=>x.favorite).length}</strong><span>FAVORITES</span></div></div></section>
<div class="search">⌕<input value="${esc(state.query)}" oninput="state.query=this.value;render()" placeholder="브랜드, 모델, 레퍼런스 검색"></div>
<div class="tags">${tags.map(t=>`<button class="tag ${state.tag===t?"on":""}" onclick="state.tag='${esc(t)}';render()">${esc(t)}</button>`).join("")}</div>
<div class="head"><div><div class="label">LOCAL ARCHIVE</div><h3>Recent Watches</h3></div><span class="count">${filtered.length} items</span></div>
<div class="grid">${filtered.map(x=>`<article class="card" onclick="detail('${x.id}')"><div class="photo"><img src="${x.image||url(x)}"><button class="heart" onclick="event.stopPropagation();favorite('${x.id}')">${x.favorite?"♥":"♡"}</button></div><div class="body"><div class="brand">${esc(x.brand)}</div><div class="model">${esc(x.model)}</div><div class="meta">${esc(x.reference)} · ${esc(x.size)} · ${esc(x.movement)}</div><div class="ctags">${(x.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join("")}</div></div></article>`).join("")}</div>
${!filtered.length?`<div class="empty">${state.items.length?"검색 결과가 없어.":"아직 시계가 없어. 첫 번째 시계를 추가해보자."}</div>`:""}
</div><nav class="nav"><span>◷<br>Watches</span><span>▧<br>Photos</span><span>▤<br>Notes</span><span>#<br>Tags</span></nav>`;
}
async function favorite(id){let x=state.items.find(x=>x.id===id);x.favorite=!x.favorite;await put(x);state.items=await all();render()}
function detail(id){let x=state.items.find(x=>x.id===id);state.modal=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><img class="detailImg" src="${x.image||url(x)}"><div class="detail"><div class="brand">${esc(x.brand)}</div><h2>${esc(x.model)}</h2><div class="meta">Ref. ${esc(x.reference)}</div><div class="facts"><span>${esc(x.year)}</span><span>${esc(x.size)}</span><span>${esc(x.movement)}</span></div><div class="ctags">${(x.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join("")}</div><div class="note"><div class="label">MY NOTE</div><p>${esc(x.note)||"메모 없음"}</p></div><div class="row"><button class="fav" onclick="favorite('${x.id}');closeModal()">${x.favorite?"♥ Favorite":"♡ Favorite"}</button><button class="danger" onclick="removeWatch('${x.id}')">Delete</button></div></div></div></div>`;showModal()}
function showModal(){document.body.insertAdjacentHTML("beforeend",state.modal)}
function closeModal(){document.querySelector(".overlay")?.remove();state.modal=null}
async function removeWatch(id){if(confirm("이 시계를 삭제할까요?")){await del(id);closeModal();state.items=await all();render()}}
function add(){state.modal=`<div class="overlay"><form class="modal form" onsubmit="saveForm(event)"><button type="button" class="close" onclick="closeModal()">×</button><div class="label">NEW ENTRY</div><h2>Add Watch</h2><div class="upload" id="upload"><div id="photoPreview">사진 추가<br><small>사진 보관함 또는 카메라</small></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center"><button type="button" class="secondary" onclick="document.getElementById('libraryFile').click()">사진 보관함</button><button type="button" class="secondary" onclick="document.getElementById('cameraFile').click()">카메라</button></div><input id="libraryFile" hidden type="file" accept="image/*" onchange="selectPhoto(this)"><input id="cameraFile" hidden type="file" accept="image/*" capture="environment" onchange="selectPhoto(this)"></div><div class="formgrid">${field("Brand","brand","Rolex")}${field("Model","model","Oyster Perpetual Date")}${field("Reference","reference","1500")}${field("Year","year","1960s")}${field("Size","size","34mm")}${field("Movement","movement","Automatic")}</div>${field("Tags","tags","vintage, silver-dial, 34mm")}${field("My Note","note","이 시계에서 마음에 드는 점...","textarea")}<button class="save">Save to Archive</button></form></div>`;showModal()}
function field(label,name,ph,type="input"){return `<label>${label}<${type} name="${name}" placeholder="${ph}"></${type}></label>`}
let selectedImage="";
function selectPhoto(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{selectedImage=r.result;document.getElementById("photoPreview").innerHTML=`<img src="${r.result}" style="width:100%;height:130px;object-fit:cover">`;};r.readAsDataURL(f);i.value=""}
async function saveForm(e){e.preventDefault();let f=new FormData(e.target),x={id:crypto.randomUUID(),brand:f.get("brand")||"Unknown",model:f.get("model")||"Untitled Watch",reference:f.get("reference")||"—",year:f.get("year")||"—",size:f.get("size")||"—",movement:f.get("movement")||"—",tags:String(f.get("tags")||"").split(",").map(x=>x.trim()).filter(Boolean),note:f.get("note")||"",favorite:false,createdAt:Date.now(),image:selectedImage};await put(x);selectedImage="";closeModal();state.items=await all();render()}
function settings(){state.modal=`<div class="overlay"><div class="modal form"><button class="close" onclick="closeModal()">×</button><div class="label">PRIVATE STORAGE</div><h2>Settings</h2><p style="color:#777;font-size:13px;line-height:1.6">시계 정보와 사진은 외부 서버가 아니라 이 기기의 브라우저 저장소에 보관돼.</p><div class="setting"><b>Export Backup</b><p>시계 정보와 사진을 하나의 JSON 파일로 백업해.</p><button class="secondary" onclick="exportBackup()">Export</button></div><div class="setting"><b>Import Backup</b><p>이전에 만든 백업을 복원해.</p><input id="importFile" hidden type="file" accept=".json" onchange="importBackup(this)"><button class="secondary" onclick="document.getElementById('importFile').click()">Import</button></div><div class="setting"><b>Delete all local data</b><p>현재 기기의 모든 시계와 사진을 삭제해.</p><button class="danger" onclick="deleteAll()">Delete all</button></div></div></div>`;showModal()}
async function exportBackup(){let payload={version:1,exportedAt:new Date().toISOString(),watches:state.items};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:"application/json"}));a.download="watch-archive-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
async function importBackup(i){if(!i.files[0])return;try{let p=JSON.parse(await i.files[0].text());if(!p.watches)throw Error();for(let x of p.watches)await put(x);state.items=await all();closeModal();render();alert("백업 복원이 완료됐어.")}catch(e){alert("올바른 Watch Archive 백업 파일이 아니야.")}}
async function deleteAll(){if(confirm("모든 로컬 데이터를 삭제할까요? 되돌릴 수 없어.")){await wipe();state.items=[];closeModal();render()}}
(async()=>{state.items=await all();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})})();
</script>
</body></html>
